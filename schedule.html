<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  :root {
--bg: #FFF5E2;
--surface: #fffaf4;
--surface2: #fef6ec;
--border: #e8d8c8;
--text: #5a4535;
--text2: #b09a86;
--early: #7ab898;
--early-bg: #b8deca;
--early-border: #88c4a8;
--late: #d4826a;
--late-bg: #F9D3BE;
--late-border: #e8b09a;
--off: #a89888;
--off-bg: #f0e8e0;
--off-border: #d4c4b8;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .month-nav button {
    background: var(--surface);
    border: 0.5px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex; align-items: center; justify-content: center;
  }

  .month-nav button:hover { background: var(--surface2); }

  .month-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }

  .weekday {
    text-align: center;
    font-size: 11px;
    color: var(--text2);
    padding: 6px 0;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .weekday.sun { color: #f87171; }
  .weekday.sat { color: #60a5fa; }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 28px;
  }

  .day {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    position: relative;
  }

  .day:active { transform: scale(0.95); }

  .day.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
    pointer-events: none;
  }

  .day.today .day-num {
    background: var(--text);
    color: var(--bg);
    border-radius: 50%;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  .day-num {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }

  .day.sun .day-num { color: #f87171; }
  .day.sat .day-num { color: #60a5fa; }

.shift-label {
    font-size: 13px;
    font-weight: 400;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }

  .shift-time {
    font-size: 9px;
    color: var(--text2);
    margin-top: 2px;
  }

  .day.early {
    background: var(--early-bg);
    border-color: var(--early-border);
  }
  .day.early .shift-label {
    background: var(--early-border);
    color: #ffffff;
  }

  .day.late {
    background: var(--late-bg);
    border-color: var(--late-border);
  }
  .day.late .shift-label {
    background: var(--late-border);
    color: #ffffff;
  }

  .day.off {
    background: var(--off-bg);
    border-color: var(--off-border);
  }
  .day.off .shift-label {
    background: var(--off-border);
    color: #ffffff;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }

  .summary-num {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .summary-lbl {
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 0.04em;
  }

  .summary-card.early-card .summary-num { color: var(--early); }
  .summary-card.late-card .summary-num { color: var(--late); }
  .summary-card.off-card .summary-num { color: var(--off); }

  .sync-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #D8E9AB, #B4D8BE);
    color: #0a1a0f;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s, transform 0.1s;
  }

  .sync-btn:hover { opacity: 0.9; }
  .sync-btn:active { transform: scale(0.98); }
  .sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 0.5px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 13px;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  #status {
    font-size: 12px;
    color: var(--text2);
    text-align: center;
    margin-top: 12px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-overlay.show { display: flex; }

  .modal-box {
    background: var(--surface);
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-sub {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 14px;
  }

  .time-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    border-bottom: 0.5px solid var(--border);
    border-radius: 8px;
  }

  .time-row.custom {
    background: #FFF5E2;
  }

  .time-row-date {
    width: 92px;
    font-size: 13px;
    color: var(--text);
    flex-shrink: 0;
  }

  .time-row-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .time-row-dot.early { background: var(--early-border); }
  .time-row-dot.late { background: var(--late-border); }

  .time-adjust {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time-adjust span {
    font-size: 14px;
    min-width: 44px;
    text-align: center;
  }

  .time-adjust-arrows {
    display: flex;
    flex-direction: column;
  }

  .time-adjust-arrows button {
    background: none;
    border: none;
    color: var(--text2);
    height: 14px;
    width: 20px;
    font-size: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .time-sep {
    font-size: 13px;
    color: var(--text2);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    border: 0.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
  }

  .modal-actions button.primary {
    background: linear-gradient(135deg, #D8E9AB, #B4D8BE);
    border: none;
    font-weight: 700;
    color: #0a1a0f;
  }

  .ot-summary {
    display: flex;
    justify-content: space-around;
    background: var(--surface2);
    border-radius: 10px;
    padding: 12px 8px;
    margin-bottom: 14px;
  }

  .ot-summary-item {
    text-align: center;
  }

  .ot-summary-num {
    font-size: 20px;
    font-weight: 700;
  }

  .ot-summary-lbl {
    font-size: 11px;
    color: var(--text2);
    margin-top: 2px;
  }

  .ot-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    border-bottom: 0.5px solid var(--border);
  }

  .ot-entry-date {
    font-size: 13px;
    width: 76px;
    flex-shrink: 0;
    color: var(--text);
  }

  .ot-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ot-badge.overtime { background: var(--early-bg); color: var(--early); }
  .ot-badge.compensatory { background: var(--late-bg); color: var(--late); }

  .ot-hours {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
  }

  .ot-hours span { min-width: 32px; text-align: center; }

  .ot-hours button {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }

  .ot-delete {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .ot-add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px 4px;
    flex-wrap: wrap;
  }

  .ot-add-row input[type="date"] {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    background: var(--surface2);
    color: var(--text);
    flex: 1;
    min-width: 120px;
  }

  .ot-type-toggle {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ot-type-toggle.overtime { background: var(--early-bg); color: var(--early); }
  .ot-type-toggle.compensatory { background: var(--late-bg); color: var(--late); }

  .ot-add-hours {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .ot-add-hours span { font-size: 14px; font-weight: 700; min-width: 32px; text-align: center; }

  .ot-add-hours button {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }

  .ot-add-btn {
    background: linear-gradient(135deg, #D8E9AB, #B4D8BE);
    border: none;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    color: #0a1a0f;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header style="position:relative;">
  <div class="month-nav">
    <button id="prev">‹</button>
    <div class="month-title" id="month-title"></div>
    <button id="next">›</button>
    
  </div>
  </div>
<button id="overtime-btn" style="position:absolute;right:206px;top:16px;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:20px;padding:10px 16px;font-size:13px;font-weight:400;cursor:pointer;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:opacity 0.15s,transform 0.1s;">加班補休</button>
<button id="custom-time-btn" style="position:absolute;right:118px;top:16px;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:20px;padding:10px 16px;font-size:13px;font-weight:400;cursor:pointer;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:opacity 0.15s,transform 0.1s;">自訂時間</button>
<button id="sync-btn" style="position:absolute;right:16px;top:16px;background:linear-gradient(135deg,#c0d6a6,#86b6a3);border:none;color:#fff9f2;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:400;cursor:pointer;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:opacity 0.15s,transform 0.1s;">傳送班表</button>
</header>

<div class="modal-overlay" id="overtime-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">加班補休</div>
      <button class="modal-close" id="overtime-close">×</button>
    </div>
    <div class="ot-summary">
      <div class="ot-summary-item">
        <div class="ot-summary-num" id="ot-total" style="color:var(--early)">0</div>
        <div class="ot-summary-lbl">加班累積（小時）</div>
      </div>
      <div class="ot-summary-item">
        <div class="ot-summary-num" id="ot-used" style="color:var(--late)">0</div>
        <div class="ot-summary-lbl">已補休（小時）</div>
      </div>
      <div class="ot-summary-item">
        <div class="ot-summary-num" id="ot-remain" style="color:var(--text)">0</div>
        <div class="ot-summary-lbl">餘（小時）</div>
      </div>
    </div>
    <div id="ot-list"></div>
    <div class="ot-add-row">
      <input type="date" id="ot-new-date">
      <button class="ot-type-toggle overtime" id="ot-type-btn">加班</button>
      <div class="ot-add-hours">
        <button id="ot-hours-minus">−</button>
        <span id="ot-hours-val">1</span>
        <button id="ot-hours-plus">＋</button>
      </div>
      <button class="ot-add-btn" id="ot-add-btn">新增</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="custom-time-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">自訂上下班時間</div>
      <button class="modal-close" id="custom-time-close">×</button>
    </div>
    <div class="modal-sub" id="custom-time-sub"></div>
    <div id="custom-time-list"></div>
    <div class="modal-actions">
      <button id="custom-time-cancel">取消</button>
      <button class="primary" id="custom-time-save">儲存</button>
    </div>
  </div>
</div>

<div class="weekdays">
<div class="weekday">一</div>
<div class="weekday">二</div>
<div class="weekday">三</div>
<div class="weekday">四</div>
<div class="weekday">五</div>
<div class="weekday sat">六</div>
<div class="weekday sun">日</div>
</div>

<div class="calendar" id="calendar"></div>

<div class="summary">
  <div class="summary-card early-card">
    <div class="summary-num" id="count-early">0</div>
    <div class="summary-lbl">早班天數</div>
  </div>
  <div class="summary-card late-card">
    <div class="summary-num" id="count-late">0</div>
    <div class="summary-lbl">晚班天數</div>
  </div>
  <div class="summary-card off-card">
    <div class="summary-num" id="count-off">0</div>
    <div class="summary-lbl">休假天數</div>
  </div>
</div>
<div class="summary-card" style="grid-column:span 3; margin-top:4px; background:var(--late-bg); border-color:var(--late-border)">
  <div style="font-size:11px;color:var(--text2);letter-spacing:0.04em;margin-bottom:8px">💰 薪資試算</div>
  <div style="display:flex;justify-content:space-around">
    <div style="text-align:center">
      <div style="font-size:16px;font-weight:700;color:var(--late)" id="daily-wage">0</div>
      <div style="font-size:11px;color:var(--text2)">日薪</div>
    </div>
    <div style="text-align:center">
      <div style="font-size:16px;font-weight:700;color:var(--early)" id="earned">0</div>
      <div style="font-size:11px;color:var(--text2)">已賺到 🎉</div>
    </div>
  </div>
</div>


<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCXNHHiH6-1hT-bEG5uy-Eyqa2dcMVX61s",
    authDomain: "my-expense-app-c4e73.firebaseapp.com",
    projectId: "my-expense-app-c4e73",
    storageBucket: "my-expense-app-c4e73.firebasestorage.app",
    messagingSenderId: "728977309080",
    appId: "1:728977309080:web:2b836492afc9a996663fed"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

const SHIFTS = ['late', 'off', 'early'];
  const LABELS = { early: '早', late: '晚', off: '休' };
  const TIMES  = { early: '', late: '', off: '' };
  const DEFAULT_TIMES = { early: { start: '07:00', end: '15:30' }, late: { start: '14:30', end: '23:00' } };

  // 取得某天的班別字串（相容舊資料的純字串格式與新資料的物件格式）
  function getShift(dateStr) {
    const v = scheduleData[dateStr];
    if (!v) return null;
    return typeof v === 'string' ? v : v.shift;
  }

  // 取得某天的上下班時間（若無自訂時間，回傳該班別預設值）
  function getTimes(dateStr) {
    const v = scheduleData[dateStr];
    const shift = getShift(dateStr);
    if (!shift || shift === 'off') return null;
    if (v && typeof v === 'object' && v.start && v.end) {
      return { start: v.start, end: v.end };
    }
    return DEFAULT_TIMES[shift];
  }

  let year, month, scheduleData = {};
  window._year = year;
  window._month = month;
  window._scheduleData = scheduleData;

  const now = new Date();
  year = now.getFullYear();
  month = now.getMonth();

  function monthKey() { return `${year}-${String(month+1).padStart(2,'0')}`; }

  async function loadSchedule() {
    const ref = doc(db, 'schedule', monthKey());
    const snap = await getDoc(ref);
    scheduleData = snap.exists() ? snap.data() : {};
    window._scheduleData = scheduleData;
    window._year = year;
    window._month = month;
    render();
  }

  async function saveSchedule() {
    const ref = doc(db, 'schedule', monthKey());
    await setDoc(ref, scheduleData);
  }

  function render() {
    const title = document.getElementById('month-title');
    title.textContent = `${year} 年 ${month+1} 月`;

    const cal = document.getElementById('calendar');
    cal.innerHTML = '';

const firstDayRaw = new Date(year, month, 1).getDay();
const firstDay = (firstDayRaw === 0) ? 6 : firstDayRaw - 1;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    let early=0, late=0, off=0;

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'day empty';
      cal.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow = new Date(year, month, d).getDay();
      const shift = getShift(dateStr);

      if (shift === 'early') early++;
      else if (shift === 'late') late++;
      else if (shift === 'off') off++;

      const el = document.createElement('div');
el.className = 'day' + (shift ? ` ${shift}` : ' late') + (dow===6 ? ' sat' : dow===0 ? ' sun' : '') + (dateStr===todayStr ? ' today' : '');

      el.innerHTML = `
        <div class="day-num">${d}</div>
        ${shift ? `<div class="shift-label">${LABELS[shift]}</div>` : '<div class="shift-label" style="opacity:0">－</div><div class="shift-time"></div>'}
      `;

      el.addEventListener('click', () => {
        const cur = SHIFTS.indexOf(shift);
        const next = SHIFTS[(cur + 1) % SHIFTS.length];
        if (next === null) delete scheduleData[dateStr];
        else scheduleData[dateStr] = next;
        saveSchedule();
        render();
      });

      cal.appendChild(el);
    }

    document.getElementById('count-early').textContent = early;
    document.getElementById('count-late').textContent = late;
    document.getElementById('count-off').textContent = off;
const totalWorkDays = early + late;
const dailyWage = totalWorkDays > 0 ? Math.round(34000 / totalWorkDays) : 0;

const todayDate = new Date();
let workedDays = 0;
Object.keys(scheduleData).forEach((dateStr) => {
  const shift = getShift(dateStr);
  if (shift && shift !== 'off') {
    const d = new Date(dateStr);
    if (d.getFullYear() === year && d.getMonth() === month && d < todayDate) {
      workedDays++;
    }
  }
});
const earned = Math.round(dailyWage * workedDays);

document.getElementById('daily-wage').textContent = `$${dailyWage.toLocaleString()}`;
  window._year = year;
  window._month = month;
  window._scheduleData = scheduleData;
document.getElementById('earned').textContent = `$${earned.toLocaleString()}`;
  }

  document.getElementById('prev').addEventListener('click', () => {
    month--; if (month < 0) { month = 11; year--; }

  loadSchedule();
  });

  document.getElementById('next').addEventListener('click', () => {
    month++; if (month > 11) { month = 0; year++; }

  loadSchedule();
  });


  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ===== 自訂上下班時間 Modal =====
  let modalDraft = {}; // 編輯中的暫存資料，按「儲存」才寫回 scheduleData

  function minutesToStr(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  function strToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
  }

  function renderCustomTimeModal() {
    const list = document.getElementById('custom-time-list');
    const sub = document.getElementById('custom-time-sub');
    list.innerHTML = '';

    const daysInMonth = new Date(year, month+1, 0).getDate();
    const weekdayNames = ['日','一','二','三','四','五','六'];
    let workDayCount = 0;
    modalDraft = {};

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const shift = getShift(dateStr);
      if (shift !== 'early' && shift !== 'late') continue;

      workDayCount++;
      const times = getTimes(dateStr);
      modalDraft[dateStr] = { shift, start: times.start, end: times.end };

      const dow = new Date(year, month, d).getDay();
      const row = document.createElement('div');
      const isCustom = times.start !== DEFAULT_TIMES[shift].start || times.end !== DEFAULT_TIMES[shift].end;
      row.className = 'time-row' + (isCustom ? ' custom' : '');
      row.dataset.date = dateStr;
      row.innerHTML = `
        <span class="time-row-date">${month+1}/${d}（${weekdayNames[dow]}）</span>
        <span class="time-row-dot ${shift}"></span>
        <div class="time-adjust">
          <span class="time-start">${times.start}</span>
          <div class="time-adjust-arrows">
            <button class="start-up" aria-label="上班時間加30分鐘">▲</button>
            <button class="start-down" aria-label="上班時間減30分鐘">▼</button>
          </div>
        </div>
        <span class="time-sep">–</span>
        <div class="time-adjust">
          <span class="time-end">${times.end}</span>
          <div class="time-adjust-arrows">
            <button class="end-up" aria-label="下班時間加30分鐘">▲</button>
            <button class="end-down" aria-label="下班時間減30分鐘">▼</button>
          </div>
        </div>
      `;

      row.querySelector('.start-up').addEventListener('click', () => adjustTime(dateStr, 'start', 30, row));
      row.querySelector('.start-down').addEventListener('click', () => adjustTime(dateStr, 'start', -30, row));
      row.querySelector('.end-up').addEventListener('click', () => adjustTime(dateStr, 'end', 30, row));
      row.querySelector('.end-down').addEventListener('click', () => adjustTime(dateStr, 'end', -30, row));

      list.appendChild(row);
    }

    sub.textContent = `${month+1} 月份，共 ${workDayCount} 個上班日`;
  }

  function adjustTime(dateStr, field, deltaMinutes, row) {
    const draft = modalDraft[dateStr];
    const newMinutes = strToMinutes(draft[field]) + deltaMinutes;
    draft[field] = minutesToStr(newMinutes);

    row.querySelector(field === 'start' ? '.time-start' : '.time-end').textContent = draft[field];

    const def = DEFAULT_TIMES[draft.shift];
    const isCustom = draft.start !== def.start || draft.end !== def.end;
    row.classList.toggle('custom', isCustom);
  }

  function openCustomTimeModal() {
    renderCustomTimeModal();
    document.getElementById('custom-time-modal').classList.add('show');
  }

  function closeCustomTimeModal() {
    document.getElementById('custom-time-modal').classList.remove('show');
  }

  async function saveCustomTimeModal() {
    for (const [dateStr, draft] of Object.entries(modalDraft)) {
      const def = DEFAULT_TIMES[draft.shift];
      if (draft.start === def.start && draft.end === def.end) {
        // 時間等於預設值，存回純字串格式（無自訂時間）
        scheduleData[dateStr] = draft.shift;
      } else {
        scheduleData[dateStr] = { shift: draft.shift, start: draft.start, end: draft.end };
      }
    }
    await saveSchedule();
    closeCustomTimeModal();
    render();
    showToast('時間已儲存');
  }

  // ===== 加班補休 =====
  let overtimeData = { entries: [] };
  let newEntryType = 'overtime';
  let newEntryHours = 1;

  async function loadOvertime() {
    const ref = doc(db, 'overtime', 'balance');
    const snap = await getDoc(ref);
    overtimeData = snap.exists() ? snap.data() : { entries: [] };
    if (!overtimeData.entries) overtimeData.entries = [];
  }

  async function saveOvertime() {
    const ref = doc(db, 'overtime', 'balance');
    await setDoc(ref, overtimeData);
  }

  function renderOvertimeModal() {
    const list = document.getElementById('ot-list');
    list.innerHTML = '';
    let totalOT = 0, totalComp = 0;

    const sorted = [...overtimeData.entries].sort((a, b) => a.date.localeCompare(b.date));

    sorted.forEach((entry, idx) => {
      const origIdx = overtimeData.entries.indexOf(entry);
      if (entry.type === 'overtime') totalOT += entry.hours;
      else totalComp += entry.hours;

      const row = document.createElement('div');
      row.className = 'ot-entry';
      row.innerHTML = `
        <span class="ot-entry-date">${entry.date}</span>
        <span class="ot-badge ${entry.type}">${entry.type === 'overtime' ? '加班' : '補休'}</span>
        <div class="ot-hours">
          <button class="ot-h-minus" data-i="${origIdx}">−</button>
          <span>${entry.hours}</span>
          <button class="ot-h-plus" data-i="${origIdx}">＋</button>
        </div>
        <button class="ot-delete" data-i="${origIdx}">×</button>
      `;
      row.querySelector('.ot-h-minus').addEventListener('click', async (e) => {
        const i = +e.target.dataset.i;
        if (overtimeData.entries[i].hours > 0.5) {
          overtimeData.entries[i].hours -= 0.5;
          await saveOvertime();
          renderOvertimeModal();
        }
      });
      row.querySelector('.ot-h-plus').addEventListener('click', async (e) => {
        const i = +e.target.dataset.i;
        overtimeData.entries[i].hours += 0.5;
        await saveOvertime();
        renderOvertimeModal();
      });
      row.querySelector('.ot-delete').addEventListener('click', async (e) => {
        const i = +e.target.dataset.i;
        overtimeData.entries.splice(i, 1);
        await saveOvertime();
        renderOvertimeModal();
      });
      list.appendChild(row);
    });

    document.getElementById('ot-total').textContent = totalOT;
    document.getElementById('ot-used').textContent = totalComp;
    document.getElementById('ot-remain').textContent = totalOT - totalComp;
  }

  async function openOvertimeModal() {
    await loadOvertime();
    // 預設日期為今天
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    document.getElementById('ot-new-date').value = todayStr;
    newEntryType = 'overtime';
    newEntryHours = 1;
    document.getElementById('ot-type-btn').className = 'ot-type-toggle overtime';
    document.getElementById('ot-type-btn').textContent = '加班';
    document.getElementById('ot-hours-val').textContent = '1';
    renderOvertimeModal();
    document.getElementById('overtime-modal').classList.add('show');
  }

  document.getElementById('overtime-btn').addEventListener('click', openOvertimeModal);
  document.getElementById('overtime-close').addEventListener('click', () => {
    document.getElementById('overtime-modal').classList.remove('show');
  });

  document.getElementById('ot-type-btn').addEventListener('click', () => {
    newEntryType = newEntryType === 'overtime' ? 'compensatory' : 'overtime';
    const btn = document.getElementById('ot-type-btn');
    btn.className = `ot-type-toggle ${newEntryType}`;
    btn.textContent = newEntryType === 'overtime' ? '加班' : '補休';
  });

  document.getElementById('ot-hours-minus').addEventListener('click', () => {
    if (newEntryHours > 0.5) { newEntryHours -= 0.5; document.getElementById('ot-hours-val').textContent = newEntryHours; }
  });
  document.getElementById('ot-hours-plus').addEventListener('click', () => {
    newEntryHours += 0.5;
    document.getElementById('ot-hours-val').textContent = newEntryHours;
  });

  document.getElementById('ot-add-btn').addEventListener('click', async () => {
    const date = document.getElementById('ot-new-date').value;
    if (!date) { showToast('請選擇日期'); return; }
    overtimeData.entries.push({ date, type: newEntryType, hours: newEntryHours });
    await saveOvertime();
    renderOvertimeModal();
    showToast('已新增');
  });

  document.getElementById('custom-time-btn').addEventListener('click', openCustomTimeModal);
  document.getElementById('custom-time-close').addEventListener('click', closeCustomTimeModal);
  document.getElementById('custom-time-cancel').addEventListener('click', closeCustomTimeModal);
  document.getElementById('custom-time-save').addEventListener('click', saveCustomTimeModal);

  // Google 日曆同步（需要 OAuth，這裡先顯示提示）

  window.addEventListener("load", () => {
    if (window.google) initGoogleAuth();
  });

  setTimeout(() => { if (window.google) initGoogleAuth(); else console.log("google not loaded"); }, 3000);
  // 登入檢查
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loadSchedule();
    } else {
      signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => {
        alert("登入失敗，請重新整理頁面");
      });
    }
  });
</script>
<script src="https://accounts.google.com/gsi/client"></script>
<script>
let tokenClient;
function initGoogleAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: '728977309080-mb7vnvfuneeep41bpjggisbntgi3k1b3.apps.googleusercontent.com',
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: async (response) => {
      if (response.error) { alert("授權失敗"); return; }
      const year = window._year;
      const month = window._month;
      const scheduleData = window._scheduleData || {};
      const token = response.access_token;
      window._token = token;
      const monthStart = String(year) + "-" + String(month+1).padStart(2,"0") + "-01";
      const lastDay = new Date(year, month+1, 0).getDate();
      const monthEnd = String(year) + "-" + String(month+1).padStart(2,"0") + "-" + String(lastDay).padStart(2,"0");
      const searchRes = await fetch(
        "https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=" + monthStart + "T00:00:00%2B08:00&timeMax=" + monthEnd + "T23:59:59%2B08:00&singleEvents=true",
        { headers: { "Authorization": "Bearer " + token } }
      );
      const searchData = await searchRes.json();
      console.log("搜尋結果:", JSON.stringify(searchData.items));
      for (const event of (searchData.items || [])) {
        if (event.summary === "早班" || event.summary === "晚班" || event.summary === "早7-15:30" || event.summary === "晚14:30-23" || event.summary === "早" || event.summary === "晚") {
          await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/" + event.id, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
          });
        }
      }
      let count = 0;
      for (const [dateStr, value] of Object.entries(scheduleData)) {
        const shift = typeof value === 'string' ? value : value.shift;
        if (shift === "off" || !shift) continue;
        const hasCustom = typeof value === 'object' && value.start && value.end;
        const time = hasCustom ? value.start : (shift === "early" ? "07:00" : "14:30");
        const endTime = hasCustom ? value.end : (shift === "early" ? "15:30" : "23:00");
        const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({
            summary: shift === "early" ? "早" : "晚",
            start: { dateTime: dateStr + "T" + time + ":00", timeZone: "Asia/Taipei" },
            end: { dateTime: dateStr + "T" + endTime + ":00", timeZone: "Asia/Taipei" },
            reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 20 }] }
          })
        });
        const created = await res.json();
        await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/" + created.id, {
          method: "PATCH",
          headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ colorId: "5" })
        });
        count++;
      }
      alert("已同步 " + count + " 筆班表到 Google 日曆！");
    }
  });
}
document.getElementById("sync-btn").addEventListener("click", () => {
  if (!tokenClient) { alert("Google 尚未載入，請稍後再試"); return; }
  tokenClient.requestAccessToken();
});
window.addEventListener("load", () => {
  setTimeout(() => { if (window.google) initGoogleAuth(); }, 500);
});
</script>
