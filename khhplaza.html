        return sc.ptMode === 'flex' && !locked(sid, compDay);
      });
      const hasMgr = covNow[sl] && covNow[sl].some(sid => {
        const s = state.staff.find(x => x.id === sid);
        return s && s.type === '主管' && !locked(sid, compDay);
      });
      const isEmpty = !covNow[sl] || covNow[sl].length === 0;
      const priority = hasPTFlex ? 0 : hasMgr ? 1 : isEmpty ? 2 : 3;
      slotPriority.push({ sl, priority });
    }
    slotPriority.sort((a, b) => a.priority - b.priority);

    let chosenSlot = null;
    for (const { sl } of slotPriority) {
      if (!slotLegalChange(staff, compDay, sl)) continue;
      if (consecBefore(staff.id, compDay) + 1 + consecAfter(staff.id, compDay) > 5) continue;
      chosenSlot = sl;
      break;
    }
    if (!chosenSlot) return null;

    const changes = [{ sid: staff.id, d: compDay, newVal: chosenSlot, origVal: get(staff.id, compDay) }];

    // 套用正職改上班，看當天 coverage
    set(staff.id, compDay, chosenSlot);
    const cov = getDayCov(compDay);

    // 如果 chosenSlot 現在有兩個人（正職接手 flex PT），移除 flex PT / 主管
    if (cov[chosenSlot].length > 1) {
      // 找同 slot 的其他人（可以換到其他 slot 或休）
      // 找在 chosenSlot 上可移除的 flex PT 或主管
      const others = cov[chosenSlot].filter(sid => {
        if (sid === staff.id) return false;
        if (locked(sid, compDay)) return false;
        const s = state.staff.find(x => x.id === sid);
        if (!s) return false;
        const sc = getSlotConfigForStaff(s);
        // 只移除 flex PT 或主管
        return sc.ptMode === 'flex' || s.type === '主管';
      });

      let rebalanced = false;
      for (const otherSid of others) {
        const other = state.staff.find(x => x.id === otherSid);
        if (!other) continue;

        // 直接移除（設空白），不需要換到其他 slot
        const _otherStaff = state.staff.find(x => x.id === otherSid);
        const _otherCfg = _otherStaff ? getSlotConfigForStaff(_otherStaff) : {};
        if (_otherStaff?.type === 'PT' && _otherCfg.ptMode === 'fixed') { rebalanced = false; break; }
        changes.push({ sid: otherSid, d: compDay, newVal: '', origVal: get(otherSid, compDay) });
        set(otherSid, compDay, '');
        rebalanced = true;
        break;

        // 以下保留但不執行（原本換班邏輯）
        const missingSlots = ['AE','AT','EA'].filter(sl => cov[sl].length === 0);
        for (const targetSlot of missingSlots) {
          const otherCfg = getSlotConfigForStaff(other);
          if (!otherCfg.slots[targetSlot]) continue;
          if (!slotLegalChange(other, compDay, targetSlot)) continue;
          if (consecBefore(otherSid, compDay) + 1 + consecAfter(otherSid, compDay) > 5) continue;

          changes.push({ sid: otherSid, d: compDay, newVal: targetSlot, origVal: get(otherSid, compDay) });
          set(otherSid, compDay, targetSlot);

          // 如果 other 原本的 slot 現在仍有人（or 是 flex PT/主管），
          // 嘗試讓 other 原本的覆蓋者休
          const origSlot = getLooseCoveredSlot(changes[changes.length-1].origVal);
          if (origSlot) {
            const newCov = getDayCov(compDay);
            if (newCov[origSlot].length > 1) {
              // 找可以移除的低優先 flex PT 或主管
              const removable = newCov[origSlot].filter(sid => {
                if (locked(sid, compDay)) return false;
                const s = state.staff.find(x => x.id === sid);
                if (!s) return false;
                const sc = getSlotConfigForStaff(s);
                if (sc.ptMode === 'fixed') return false;
                if (s.type === 'PT' || s.type === '主管') return true;
                return false;
              });
              for (const rSid of removable) {
                const rOrig = get(rSid, compDay);
                const _rStaff = state.staff.find(x => x.id === rSid);
              const _rCfg = _rStaff ? getSlotConfigForStaff(_rStaff) : {};
              if (_rStaff?.type === 'PT' && _rCfg.ptMode === 'fixed') break;
              changes.push({ sid: rSid, d: compDay, newVal: '', origVal: rOrig });
                set(rSid, compDay, '');
                break; // 一次只移一個
              }
            }
          }
          rebalanced = true;
          break;
        }
        if (rebalanced) break;
      }
    }

    // 還原所有暫時修改（bundle 由外層統一套用）
    for (const ch of [...changes].reverse()) {
      set(ch.sid, ch.d, ch.origVal);
    }

    return changes;
  }



  let improved = true;
  let loop = 0;
  while (improved && loop++ < 30) {
    improved = false;
    for (let d = 1; d <= days; d++) {
      const cov = getDayCov(d);
      for (const slot of ['AE','AT','EA']) {
        const hasPTFixed = cov[slot].some(sid => {
          const s = state.staff.find(x => x.id === sid);
          return s && getSlotConfigForStaff(s).ptMode === 'fixed';
        });
        if (!hasPTFixed) continue;

        const seikaInSlot = cov[slot].filter(sid => {
          const s = state.staff.find(x => x.id === sid);
          return s && s.type === '正職' && !locked(sid, d);
        });
        if (seikaInSlot.length === 0) continue;

        for (const sid of seikaInSlot) {
          const staff = state.staff.find(x => x.id === sid);
          if (!staff) continue;
          if (!covOKWithoutStaff(sid, d)) continue;

          const currentOff = countOff(sid);
          if (currentOff > quotaTotal) continue;

          const cfg = getSlotConfigForStaff(staff);
          const mainSlot = cfg.mainSlot || (staff.canShifts || [])[0];

          // 找候選補償日（優先找能解除連休的附近休假日）
          const candidateCompDays = [];
          for (let cd = 1; cd <= days; cd++) {
            if (cd === d) continue;
            if (!isAutoRest(sid, cd)) continue;
            const distToRest = Math.abs(cd - d); // 距離移休日
            // 優先：能解除 d 附近的連休
            const breaksRestChain = Math.abs(cd - d) <= 3;
            candidateCompDays.push({ cd, breaksRestChain, dist: distToRest });
          }
          // 先找能切斷連休的，再找近的
          candidateCompDays.sort((a, b) => {
            if (a.breaksRestChain !== b.breaksRestChain)
              return a.breaksRestChain ? -1 : 1;
            return a.dist - b.dist;
          });

          // 嘗試所有補償日 × 所有可上班別的組合
          let foundBundle = false;
          const slotsToTry = currentOff >= quotaTotal
            ? [mainSlot, ...(staff.canShifts || []).filter(s => s !== mainSlot)]
            : [null]; // quota 未滿不需要補償日

          outer: for (const compSlot of slotsToTry) {
            if (compSlot === null) {
              // quota 未滿：直接嘗試移休，不需補償
              const origD = get(sid, d);
              const hardBefore = hardCountNonManual();
              const supBefore = supervisorDays();
              set(sid, d, '休');
              const hardAfter = hardCountNonManual();
              const supAfter = supervisorDays();
              const offAfter = countOff(sid);
              if (hardAfter <= hardBefore && supAfter <= supBefore && offAfter <= quotaTotal) {
                optLog.push({ day:d, staff:staff.name, action:'移休（quota未滿）', result:'保留' });
                improved = true;
                foundBundle = true;
              } else {
                set(sid, d, origD);
              }
              break outer;
            }

            for (const { cd } of candidateCompDays) {
              // 嘗試補償日 re-balance bundle
              const bundle = tryCompensateDayBundle(staff, cd, compSlot);
              if (!bundle) continue;

              // Atomic：套用移休 + 整組補償 bundle
              const origD = get(sid, d);
              const hardBefore = hardCountNonManual();
              const supBefore  = supervisorDays();
              const dupBefore  = (() => {
                let cnt = 0;
                for (let dd = 1; dd <= days; dd++) {
                  const cv = getDayCov(dd);
                  for (const sl of ['AE','AT','EA']) if (cv[sl].length > 1) cnt += cv[sl].length - 1;
                }
                return cnt;
              })();

              set(sid, d, '休');
              for (const ch of bundle) set(ch.sid, ch.d, ch.newVal);

              const hardAfter = hardCountNonManual();
              const supAfter  = supervisorDays();
              const dupAfter  = (() => {
                let cnt = 0;
                for (let dd = 1; dd <= days; dd++) {
                  const cv = getDayCov(dd);
                  for (const sl of ['AE','AT','EA']) if (cv[sl].length > 1) cnt += cv[sl].length - 1;
                }
                return cnt;
              })();
              const offAfter  = countOff(sid);
              const quotaOK   = offAfter <= quotaTotal;

              if (hardAfter <= hardBefore && supAfter <= supBefore
                  && dupAfter <= dupBefore && quotaOK) {
                const actions = bundle.map(ch => ch.sid + ':' + ch.origVal + '→' + ch.newVal).join(' | ');
                optLog.push({ day:d, staff:staff.name,
                  action:'移休 '+d+'日休，補'+cd+'日 ['+actions+']', result:'保留' });
                improved = true;
                foundBundle = true;
                break outer;
              } else {
                set(sid, d, origD);
                for (const ch of [...bundle].reverse()) set(ch.sid, ch.d, ch.origVal);
              }
            }
          }
          if (foundBundle) break;
        }
        if (improved) break;
      }
      if (improved) break;
    }
  }

  // === 優化：主管排班但正職空白格可以接，移除主管班 ===
  const manager = state.staff.find(s => s.type === '主管');
  const seika = state.staff.filter(s => s.type === '正職');
  if (manager) {
    for (let d = 1; d <= days; d++) {
      if (locked(manager.id, d)) continue;
      const mgrSlot = getLooseCoveredSlot(get(manager.id, d));
      if (!mgrSlot) continue;
      const replaceable = seika.find(s => {
        if (locked(s.id, d)) return false;
        const cfg = getSlotConfigForStaff(s);
        if (!cfg.slots[mgrSlot]) return false;
        if (get(s.id, d) !== '') return false;
        if (!slotLegalChange(s, d, mgrSlot)) return false;
        if (consecBefore(s.id, d) + 1 + consecAfter(s.id, d) > 5) return false;
        return true;
      });
      if (!replaceable) continue;
      const origMgr = get(manager.id, d);
      const hardBefore = hardCountNonManual();
      const supBefore = supervisorDays();
      const _mgrStaff = state.staff.find(x => x.id === manager.id);
      const _mgrCfg = _mgrStaff ? getSlotConfigForStaff(_mgrStaff) : {};
      if (_mgrStaff?.type === 'PT' && _mgrCfg.ptMode === 'fixed') continue;
      set(manager.id, d, '');
      set(replaceable.id, d, mgrSlot);
      const hardAfter = hardCountNonManual();
      const supAfter = supervisorDays();
      if (hardAfter <= hardBefore && supAfter < supBefore) {
        optLog.push({ day:d, staff:manager.name, action:'主管→空白，'+replaceable.name+'補'+mgrSlot, result:'保留' });
      } else {
        set(manager.id, d, origMgr);
        set(replaceable.id, d, '');
      }
    }
  }

  if (optLog.length > 0) {
    console.log('[Phase6] 優化記錄：');
    console.table(optLog);
  }
  return sch;
}

function optimizeOverstaffingAndSupervisor(solverInput, sch) {
  return optimizeByMovingRestForDuplicateCoverage(solverInput, sch);
}

// ===== SOLVER PHASE 3c: 修補正職自動連休超過 2 天 =====

function repairAutoRestOver2(solverInput, sch) {
  const { manualLocks, days, quota } = solverInput;
  const quotaTotal = quota.li + quota.xi + quota.guo;
  const repairLog = [];
  const failLog = [];

  function get(sid, d) { return (sch[sid] && sch[sid][d]) || ''; }
  function set(sid, d, v) { if (sch[sid]) sch[sid][d] = v; }
  function locked(sid, d) { return manualLocks.has(cellKey(sid, d)); }
  function isAutoOff(sid, d) { return OFF.includes(get(sid, d)) && !locked(sid, d); }
  function countOff(sid) {
    let c = 0;
    for (let d = 1; d <= days; d++) if (OFF.includes(get(sid, d))) c++;
    return c;
  }
  function consecBefore(sid, d) {
    let c = 0;
    for (let dd = d-1; dd >= 1; dd--) { if (isWork(get(sid, dd))) c++; else break; }
    return c;
  }
  function consecAfter(sid, d) {
    let c = 0;
    for (let dd = d+1; dd <= days; dd++) { if (isWork(get(sid, dd))) c++; else break; }
    return c;
  }
  function slotLegal(staff, d, slot) {
    const prev = d > 1    ? get(staff.id, d-1) : '';
    const next = d < days ? get(staff.id, d+1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRestByDay(staff, prev, d-1, slot, d)) return false;
      if (isForbiddenShiftPair(prev, slot)) return false;
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRestByDay(staff, slot, d, next, d+1)) return false;
      if (isForbiddenShiftPair(slot, next)) return false;
    }
    return true;
  }

  function getViolSummary() {
    const r = validateSchedule({ schedule: sch, manualLocks, days, quota });
    const hv = r.hardViolations.filter(v => v.source !== 'manual');
    return {
      total: hv.length,
      autoRest: hv.filter(v => v.type === 'AUTO_REST_OVER2').length,
      shiftNotCovered: hv.filter(v => v.type === 'SHIFT_NOT_COVERED').length,
      elevenHour: hv.filter(v => v.type === 'ELEVEN_HOUR_VIOLATION').length,
      consecutive: hv.filter(v => v.type === 'CONSECUTIVE_OVER5').length,
      quotaMismatch: hv.filter(v => v.type === 'QUOTA_MISMATCH').length,
    };
  }

  function isImprovedRest(before, after) {
    if (after.autoRest >= before.autoRest) return false;
    if (after.shiftNotCovered > before.shiftNotCovered) return false;
    if (after.elevenHour > before.elevenHour) return false;
    if (after.consecutive > before.consecutive) return false;
    if (after.quotaMismatch > before.quotaMismatch) return false;
    return true;
  }

  // 嘗試找合法替補（最多一層連鎖修補）
  // 回傳 { changes: [{sid,d,newVal,origVal}] } 或 null
  function tryFindReplacement(targetSid, compDay, compSlot) {
    const replacePriority = getCandidatesForSlot(compSlot).filter(sid => sid !== targetSid);
    const failReasons = [];

    for (const rsid of replacePriority) {
      const rs = state.staff.find(x => x.id === rsid);
      if (!rs) continue;
      const rsCfg = getSlotConfigForStaff(rs);
      if (rsCfg.ptMode === 'fixed') { failReasons.push(rs.name+':fixed PT'); continue; }
      if (!rsCfg.slots[compSlot]) { failReasons.push(rs.name+':canShifts不含'+compSlot); continue; }
      if (locked(rsid, compDay)) { failReasons.push(rs.name+':manualLocks'); continue; }
      const rv = get(rsid, compDay);
      if (OFF.includes(rv) || SICK.includes(rv)) { failReasons.push(rs.name+':當天休假'); continue; }
      if (rs.type === 'PT') {
        let wc = 0;
        for (let d = 1; d <= days; d++) if (isWork(get(rsid, d))) wc++;
        if (wc >= 15) { failReasons.push(rs.name+':PT月上限'); continue; }
      }
      if (consecBefore(rsid, compDay) + 1 + consecAfter(rsid, compDay) > 5) {
        failReasons.push(rs.name+':連上超過5'); continue;
      }

      // 檢查 11h：可能需要一層連鎖修補
      if (slotLegal(rs, compDay, compSlot)) {
        // 第一層直接成功
        return { changes: [{ sid:rsid, d:compDay, newVal:compSlot, origVal:rv }], failReasons };
      }

      // 11h 失敗，嘗試一層連鎖：找 rs 相鄰衝突班並移開
      const prevD = compDay - 1, nextD = compDay + 1;
      for (const adjD of [prevD, nextD]) {
        if (adjD < 1 || adjD > days) continue;
        const adjV = get(rsid, adjD);
        if (!isWork(adjV)) continue;
        if (locked(rsid, adjD)) continue;

        // adjD 的班是否跟 compSlot 衝突
        const adjStaff = rs;
        const prevOK = adjD === prevD
          ? hasElevenHourRestByDay(adjStaff, adjV, adjD, compSlot, compDay) && !isForbiddenShiftPair(adjV, compSlot)
          : true;
        const nextOK = adjD === nextD
          ? hasElevenHourRestByDay(adjStaff, compSlot, compDay, adjV, adjD) && !isForbiddenShiftPair(compSlot, adjV)
          : true;
        if (prevOK && nextOK) continue; // 其實不衝突，跳過

        // 找 adjD 的班別替補（一層，不再遞迴）
        const adjSlot = getLooseCoveredSlot(adjV) || adjV;
        const adjPriority = getCandidatesForSlot(adjSlot).filter(sid => sid !== rsid && sid !== targetSid);
        for (const asid of adjPriority) {
          const as = state.staff.find(x => x.id === asid);
          if (!as) continue;
          const asCfg = getSlotConfigForStaff(as);
          if (asCfg.ptMode === 'fixed') continue;
          if (!asCfg.slots[adjSlot]) continue;
          if (locked(asid, adjD)) continue;
          const av = get(asid, adjD);
          if (OFF.includes(av) || SICK.includes(av)) continue;
          if (as.type === 'PT') {
            let wc = 0;
            for (let d = 1; d <= days; d++) if (isWork(get(asid, d))) wc++;
            if (wc >= 15) continue;
          }
          if (consecBefore(asid, adjD) + 1 + consecAfter(asid, adjD) > 5) continue;
          if (!slotLegal(as, adjD, adjSlot)) continue;

          // 模擬：rs 補 compSlot，as 補 adjSlot，rs 原 adjSlot 移除
          const changes = [
            { sid:rsid, d:compDay, newVal:compSlot, origVal:rv },
            { sid:rsid, d:adjD,    newVal:'',        origVal:adjV },
            { sid:asid, d:adjD,    newVal:adjSlot,   origVal:av },
          ];
          // 暫套用驗 11h
          changes.forEach(ch => set(ch.sid, ch.d, ch.newVal));
          const rsLegalNow = slotLegal(rs, compDay, compSlot);
          changes.reverse().forEach(ch => set(ch.sid, ch.d, ch.origVal));
          changes.reverse();

          if (rsLegalNow) {
            return { changes, failReasons };
          }
        }
        failReasons.push(rs.name+':11h衝突且相鄰班無法移開');
      }
    }
    return { changes: null, failReasons };
  }

  const seika = state.staff.filter(s => s.type === '正職');

  let improved = true;
  let loop = 0;
  while (improved && loop++ < 20) {
    improved = false;

    for (const s of seika) {
      let streak = 0, streakStart = 1, violation = -1;
      for (let d = 1; d <= days; d++) {
        if (isAutoOff(s.id, d)) {
          if (streak === 0) streakStart = d;
          streak++;
          if (streak > 2) { violation = streakStart; break; }
        } else streak = 0;
      }
      if (violation === -1) continue;

      const restSegment = [];
      for (let d = violation; d <= days && isAutoOff(s.id, d); d++) restSegment.push(d);

      // 優先選頭或尾，避免碎片化（休上休上休）
      const workDayCandidates = (() => {
        const first = restSegment[0];
        const last  = restSegment[restSegment.length - 1];
        const rest  = restSegment.slice(1, -1);
        return [first, last, ...rest];
      })();

      const cfg = getSlotConfigForStaff(s);
      const slotsToTry = [cfg.mainSlot, ...(s.canShifts||[]).filter(sl=>sl!==cfg.mainSlot)].filter(Boolean);
      const currentOff = countOff(s.id);
      let bundleApplied = false;

      for (const workDay of workDayCandidates) {
        if (bundleApplied) break;
        for (const slot of slotsToTry) {
          if (bundleApplied) break;
          if (!slotLegal(s, workDay, slot)) continue;
          if (consecBefore(s.id, workDay) + 1 + consecAfter(s.id, workDay) > 5) continue;

          // 找 workDay 上該 slot 的低順位佔位者（flex PT / 主管，非手動格）
          function findRemovableOccupant(day, sl, excludeSid) {
            const covNow = (() => {
              const c = { AE:[], AT:[], EA:[] };
              state.staff.forEach(st => {
                const sv = getLooseCoveredSlot(get(st.id, day));
                if (sv) c[sv].push(st.id);
              });
              return c;
            })();
            return (covNow[sl] || []).find(sid => {
              if (sid === excludeSid) return false;
              if (locked(sid, day)) return false;
              const st = state.staff.find(x => x.id === sid);
              if (!st) return false;
              const sc = getSlotConfigForStaff(st);
              return sc.ptMode === 'flex' || st.type === '主管';
            }) || null;
          }

          // 情況1：超額，直接改上班（同時移除重複覆蓋者）
          if (currentOff > quotaTotal) {
            const orig = get(s.id, workDay);
            const removeSid = findRemovableOccupant(workDay, slot, s.id);
            const removeOrig = removeSid ? get(removeSid, workDay) : null;
            const before = getViolSummary();
            set(s.id, workDay, slot);
            if (removeSid) {
              const _remStaff = state.staff.find(x => x.id === removeSid);
              const _remCfg = _remStaff ? getSlotConfigForStaff(_remStaff) : {};
              if (!(_remStaff?.type === 'PT' && _remCfg.ptMode === 'fixed')) {
                set(removeSid, workDay, '');
              }
            }
            const after = getViolSummary();
            if (isImprovedRest(before, after)) {
              repairLog.push({ staff:s.name, workDay, slot, compDay:'-', result:'成功（超額）' });
              improved = true; bundleApplied = true;
            } else {
              set(s.id, workDay, orig);
              if (removeSid) set(removeSid, workDay, removeOrig);
            }
            continue;
          }

          // 情況2&3：需要 compDay + 替補
          const compCandidates = [];
          for (let d = 1; d <= days; d++) {
            if (d === workDay || restSegment.includes(d) || locked(s.id, d)) continue;
            if (!isWork(get(s.id, d))) continue;
            compCandidates.push(d);
          }
          compCandidates.sort((a, b) => Math.abs(a - workDay) - Math.abs(b - workDay));

          const allCompFail = [];
          for (const compDay of compCandidates) {
            if (bundleApplied) break;
            const compSlot = getLooseCoveredSlot(get(s.id, compDay));
            const { changes: repChanges, failReasons } = compSlot
              ? tryFindReplacement(s.id, compDay, compSlot)
              : { changes: [], failReasons: [] };

            if (compSlot && !repChanges) {
              allCompFail.push('compDay='+compDay+':'+failReasons.join('；'));
              continue;
            }

            // 移除 workDay 上 slot 的低順位佔位者
            const removeSid2 = findRemovableOccupant(workDay, slot, s.id);
            const removeExtra = removeSid2
              ? [{ sid:removeSid2, d:workDay, newVal:'', origVal:get(removeSid2,workDay) }]
              : [];

            // Atomic bundle
            const bundle = [
              { sid:s.id, d:workDay, newVal:slot, origVal:get(s.id,workDay) },
              { sid:s.id, d:compDay, newVal:'休', origVal:get(s.id,compDay) },
              ...removeExtra,
              ...(repChanges||[]),
            ];
            const before = getViolSummary();
            bundle.forEach(ch => set(ch.sid, ch.d, ch.newVal));
            const after = getViolSummary();
            const offAfter = countOff(s.id);

            if (isImprovedRest(before, after) && offAfter <= quotaTotal) {
              repairLog.push({ staff:s.name, workDay, slot, compDay, result:'成功' });
              improved = true; bundleApplied = true;
            } else {
              [...bundle].reverse().forEach(ch => set(ch.sid, ch.d, ch.origVal));
              allCompFail.push('compDay='+compDay+':validate未改善');
            }
          }

          if (!bundleApplied && allCompFail.length > 0) {
            failLog.push({ staff:s.name, workDay, slot, reason:allCompFail.slice(0,3).join(' | ') });
          }
        }
      }
    }
  }

  if (repairLog.length > 0) {
    console.log('[Phase3c] 修補成功：');
    console.table(repairLog);
  }
  if (failLog.length > 0) {
    console.warn('[Phase3c] 修補失敗：');
    console.table(failLog.slice(0, 5));
  }

  return sch;
}


// ===== SOLVER PHASE 3a: 針對 SHIFT_NOT_COVERED 局部修復 =====

function targetedRepairMissingShifts(solverInput, resultSchedule) {
  const { manualLocks, days, quota } = solverInput;
  const sch = resultSchedule;
  const repairFailures = [];

  function get(staffId, d) { return (sch[staffId] && sch[staffId][d]) || ''; }
  function set(staffId, d, v) { if (sch[staffId]) sch[staffId][d] = v; }

  function shiftLegalInSch(staffId, d, shift) {
    const staff = state.staff.find(s => s.id === staffId);
    const prev = d > 1    ? get(staffId, d - 1) : '';
    const next = d < days ? get(staffId, d + 1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRestByDay(staff, prev, d - 1, shift, d)) return false;
      if (isForbiddenShiftPair(prev, shift)) return false;
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRestByDay(staff, shift, d, next, d + 1)) return false;
      if (isForbiddenShiftPair(shift, next)) return false;
    }
    return true;
  }

  function consecBefore(staffId, d) {
    let c = 0;
    for (let dd = d - 1; dd >= 1; dd--) {
      if (isWork(get(staffId, dd))) c++; else break;
    }
    return c;
  }
  function consecAfter(staffId, d) {
    let c = 0;
    for (let dd = d + 1; dd <= days; dd++) {
      if (isWork(get(staffId, dd))) c++; else break;
    }
    return c;
  }

  function countHardViolations(schedule) {
    const check = validateSchedule({ schedule, manualLocks, days, quota });
    return check.hardViolations.filter(v => v.source !== 'manual').length;
  }

  // 找出 SHIFT_NOT_COVERED
  const checkResult = validateSchedule({ schedule: sch, manualLocks, days, quota });



  const missing = checkResult.hardViolations.filter(v => v.type === 'SHIFT_NOT_COVERED');

  for (const mv of missing) {
    const { day: d, shift: missingShift } = (() => {
      // 從 detail 解析 day 和 shift（用 violation.day 欄位）
      return { day: mv.day, shift: mv.detail.match(/([A-Z]+) 班/)?.[1] };
    })();
    if (!d || !missingShift) continue;

    // 再確認這天是否真的還缺班
    const stillMissing = !state.staff.some(s => getLooseCoveredSlot(get(s.id, d)) === missingShift);
    if (!stillMissing) continue;

    const failLog = [];
    let repaired = false;

    // Step 1: 嘗試 PT（只用 flex PT，fixed PT 不進入自動排班）
    const ptAll = state.staff.filter(s => {
      if (s.type !== 'PT') return false;
      const cfg = getSlotConfigForStaff(s);
      return cfg.ptMode !== 'fixed';
    });
    for (const pt of ptAll) {
      const key = cellKey(pt.id, d);
      if (manualLocks.has(key)) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: 'manual_locked' }); continue; }
      if (!pt.canShifts.includes(missingShift)) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: 'cannot_shift' }); continue; }
      const v = get(pt.id, d);
      if (SICK.includes(v)) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: 'sick_leave' }); continue; }
      if (isWork(v) && v !== missingShift) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: 'already_working['+v+']' }); continue; }
      let ptWorkDays = 0;
      for (let dd = 1; dd <= days; dd++) if (isWork(get(pt.id, dd))) ptWorkDays++;
      if (ptWorkDays >= 15) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: 'pt_over15' }); continue; }
      if (consecBefore(pt.id, d) + 1 + consecAfter(pt.id, d) > 5) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: 'consecutive_over5' }); continue; }
      if (!shiftLegalInSch(pt.id, d, missingShift)) { failLog.push({ name: pt.name, type: 'PT', rejectedBecause: '11h_or_forbidden' }); continue; }
      const orig = get(pt.id, d);
      const before = countHardViolations(sch);

      set(pt.id, d, missingShift);
      if (countHardViolations(sch) < before) { repaired = true; break; }
      set(pt.id, d, orig);
    }
    if (repaired) continue;

    // Step 2: 嘗試主管
    const manager = state.staff.find(s => s.type === '主管');
    if (manager) {
      const key = cellKey(manager.id, d);
      const mgrV = get(manager.id, d);
      const mgrConsec = consecBefore(manager.id, d) + 1 + consecAfter(manager.id, d);
      const mgrLegal = shiftLegalInSch(manager.id, d, missingShift);

      const canTry = !manualLocks.has(key)
        && manager.canShifts.includes(missingShift)
        && !SICK.includes(mgrV)
        && mgrConsec <= 5
        && mgrLegal;
      if (canTry) {
        const orig = get(manager.id, d);
        const before = countHardViolations(sch);
        set(manager.id, d, missingShift);
        if (countHardViolations(sch) < before) { repaired = true; }
        else set(manager.id, d, orig);
      } else {
        failLog.push({ name: manager.name, type: '主管', rejectedBecause: 'rules_failed' });
      }
    }
    if (repaired) continue;

    // Step 3: 彈性正職換班
    const flexSeika = state.staff.filter(s =>
      s.type === '正職' && s.canShifts.length >= 2 && s.canShifts.includes(missingShift)
    );
    for (const fs of flexSeika) {
      const key = cellKey(fs.id, d);
      if (manualLocks.has(key)) { failLog.push({ name: fs.name, type: '正職', rejectedBecause: 'manual_locked' }); continue; }
      const curV = get(fs.id, d);
      if (!isWork(curV) || curV === missingShift) { failLog.push({ name: fs.name, type: '正職', rejectedBecause: 'not_working_or_same_shift' }); continue; }
      // 確認原班別仍有其他人覆蓋
      const origSlot = getLooseCoveredSlot(curV);
      if (origSlot) {
        const othersCover = state.staff.some(other => {
          if (other.id === fs.id) return false;
          return getLooseCoveredSlot(get(other.id, d)) === origSlot;
        });
        if (!othersCover) { failLog.push({ name: fs.name, type: '正職', rejectedBecause: 'orig_shift_would_be_uncovered['+origSlot+']' }); continue; }
      }
      if (!shiftLegalInSch(fs.id, d, missingShift)) { failLog.push({ name: fs.name, type: '正職', rejectedBecause: '11h_or_forbidden' }); continue; }
      if (consecBefore(fs.id, d) + 1 + consecAfter(fs.id, d) > 5) { failLog.push({ name: fs.name, type: '正職', rejectedBecause: 'consecutive_over5' }); continue; }
      const orig = curV;
      const before = countHardViolations(sch);
      set(fs.id, d, missingShift);
      if (countHardViolations(sch) < before) { repaired = true; break; }
      set(fs.id, d, orig);
      failLog.push({ name: fs.name, type: '正職', rejectedBecause: 'worsened_violations' });
    }
    if (repaired) continue;

    repairFailures.push({
      day: d, missingShift,
      reason: '無合法候選人',
      candidates: failLog
    });
  }

  if (repairFailures.length > 0) {
    console.warn('[Phase3a] 修補失敗：');
    console.table(repairFailures.map(f => ({
      日期: f.day + '日',
      缺班: f.missingShift,
      原因: f.candidates.map(c => c.name + ':' + c.rejectedBecause).join(' | ') || f.reason
    })));
  }



  return sch;
}

// ===== SOLVER PHASE 0: 資料結構轉換 =====

function buildScheduleFromState(days) {
  const schedule = {};
  const manualLocks = new Map();

  state.staff.forEach(s => {
    schedule[s.id] = {};
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      const v = state.cells[key] || '';
      schedule[s.id][d] = v;
      const cfg = getSlotConfigForStaff(s);
      const isFixedPT = s.type === 'PT' && cfg.ptMode === 'fixed';

      if (isFixedPT) {
        // fixed PT 整列都是人工區，autoSchedule 只讀不寫
        manualLocks.set(key, v || '');
        schedule[s.id][d] = v || '';
        continue;
      }

      if (v && state.edited.has(key)) {
        manualLocks.set(key, v);
      }
    }
  });


  return { schedule, manualLocks };
}

function applyScheduleToState(schedule, manualLocks, days) {
  // 先驗證，有 hardViolation 就拒絕寫入
  const quota = getQuota();
  const result = validateSchedule({ schedule, manualLocks, days, quota });
  if (result.hardViolations.length > 0) {
    console.table(result.hardViolations);
    showToast('排班結果有 ' + result.hardViolations.length + ' 個硬性違規，未寫入，請查看 console');
    return false;
  }

  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      // 手動格絕對不覆蓋
      if (manualLocks.has(key)) return;
      const v = schedule[s.id] ? (schedule[s.id][d] || '') : '';
      if (v === '') {
        delete state.cells[key];
      } else {
        state.cells[key] = v;
      }
    }
  });
  return true;
}

function getPredictedShift(staff, day, days) {
  if (day < 1 || day > days) return '';
  const key = cellKey(staff.id, day);
  if (state.edited.has(key)) {
    return state.cells[key] || '';
  }
  const v = state.cells[key] || '';
  if (v) return v; // 已寫入的自動班別
  if (staff.type === '正職') {
    if (staff._officialOffSet) {
      if (staff._officialOffSet.has(day)) return '休';
      if (staff._manualLeaveDays && staff._manualLeaveDays.has(day)) return '事';
      return staff._mainShift || '';
    } else {
      // 尚未排到的正職，暫時視為上主班
      return staff._mainShift || '';
    }
  }
  // PT / 主管：沒有就是空白
  return '';
}

function canBeCoveredLater(targetStaff, day, missingShift, days) {
  const candidates = state.staff.filter(s => s.id !== targetStaff.id);
  for (const s of candidates) {
    const key = cellKey(s.id, day);
    // 手動畫格：只讀不預測
    if (state.edited.has(key)) {
      const v = state.cells[key] || '';
      const sh = whichShift(v);
      if (sh === missingShift) return true;
      continue;
    }
    // 已是休假或請假
    const v = state.cells[key] || '';
    if (OFF.includes(v) || SICK.includes(v)) continue;
    // 不包含目標班別
    if (!s.canShifts || !s.canShifts.includes(missingShift)) continue;
    // 正職：當天如果已在 _officialOffSet 就不能補
    if (s.type === '正職') {
      if (s._officialOffSet && s._officialOffSet.has(day)) continue;
      if (s._manualLeaveDays && s._manualLeaveDays.has(day)) continue;
    }
    // PT：月上班上限 15
    if (s.type === 'PT') {
      let cnt = 0;
      for (let d = 1; d <= days; d++) {
        if (isWork(state.cells[cellKey(s.id, d)] || '')) cnt++;
      }
      if (cnt >= 15) continue;
    }
    // 11h 間隔：用 getPredictedShift 預估前後班別
    const prev = getPredictedShift(s, day - 1, days);
    const next = getPredictedShift(s, day + 1, days);
    if (prev && isWork(prev) && !checkAdjacent(prev, missingShift)) continue;
    if (next && isWork(next) && !checkAdjacent(missingShift, next)) continue;
    // 連續上班檢查：用 wouldExceedMaxConsecutiveWork
    if (wouldExceedMaxConsecutiveWork(s.id, day, missingShift, days)) continue;
    return true;
  }
  return false;
}

function wouldBreakDailyShiftCoverage(targetStaff, day, days) {
  // 回傳缺少且無法補的班別 Set
  const covered = new Set();
  for (const s of state.staff) {
    if (s.id === targetStaff.id) continue;
    const sh = getLooseCoveredSlot(getPredictedShift(s, day, days));
    if (sh) covered.add(sh);
  }
  const unrecoverable = new Set();
  for (const sh of ['AE','AT','EA']) {
    if (!covered.has(sh)) {
      if (!canBeCoveredLater(targetStaff, day, sh, days)) {
        unrecoverable.add(sh);
      }
    }
  }
  return unrecoverable.size > 0;
}

function countOfficialOff(staffId, days) {
  let li = 0, xi = 0, guo = 0, sick = 0;
  for (let d = 1; d <= days; d++) {
    const v = state.cells[cellKey(staffId, d)] || '';
    if (v === '例') li++;
    else if (v === '休') xi++;
    else if (v === '國') guo++;
    else if (SICK.includes(v)) sick++;
  }
  return { li, xi, guo, total: li + xi + guo, sick };
}

function finalValidateSchedule(days) {
  const violations = [];
  state.staff.forEach(s => {
    // 1. 連續上班 > 5
    let streak = 0, streakStart = 1;
    for (let d = 1; d <= days; d++) {
      const v = state.cells[cellKey(s.id, d)] || '';
      if (isWork(v)) {
        if (streak === 0) streakStart = d;
        streak++;
        if (streak > 5) violations.push({rule:'連上超過5天', name:s.name, detail:streakStart+'~'+d+'日'});
      } else { streak = 0; }
    }
    // 2. 自動連休 > 2
    let offStreak = 0, offStart = 1;
    for (let d = 1; d <= days; d++) {
      const k = cellKey(s.id, d);
      const v = state.cells[k] || '';
      const isAutoOff = (OFF.includes(v) || SICK.includes(v)) && !state.edited.has(k);
      if (isAutoOff) {
        if (offStreak === 0) offStart = d;
        offStreak++;
        if (offStreak > 2) violations.push({rule:'自動連休超過2天', name:s.name, detail:offStart+'~'+d+'日'});
      } else { offStreak = 0; }
    }
    // 3. 11小時違規
    for (let d = 1; d < days; d++) {
      const v1 = state.cells[cellKey(s.id, d)] || '';
      const v2 = state.cells[cellKey(s.id, d+1)] || '';
      if (isWork(v1) && isWork(v2) && !checkAdjacent(v1, v2)) {
        violations.push({rule:'11h間隔違規', name:s.name, detail:d+'日'+v1+'→'+(d+1)+'日'+v2});
      }
    }
    // 4. PT 月上班 > 15
    if (s.type === 'PT') {
      let cnt = 0;
      for (let d = 1; d <= days; d++) {
        if (isWork(state.cells[cellKey(s.id, d)] || '')) cnt++;
      }
      if (cnt > 15) violations.push({rule:'PT月上班超過15天', name:s.name, detail:'共'+cnt+'天'});
    }
  });
  // 6. 正職休假總數驗證
  const quota2 = getQuota();
  const quotaTotal = quota2.li + quota2.xi + quota2.guo;
  state.staff.filter(s => s.type === '正職').forEach(s => {
    const c = countOfficialOff(s.id, days);
    if (c.total !== quotaTotal) {
      violations.push({rule:'官方休假總數不符', name:s.name, detail:'實際' + c.total + '天，應為' + quotaTotal + '天'});
    }
  });

  // 7. 每日 AE / AT / EA 覆蓋驗證（用最終 state.cells）
  for (let d = 1; d <= days; d++) {
    const covered = new Set();
    const working = [], resting = [];
    state.staff.forEach(s => {
      const v = state.cells[cellKey(s.id, d)] || '';
      const sh = whichShift(v);
      if (sh) { covered.add(sh); working.push(s.name + '(' + sh + ')'); }
      else if (v) resting.push(s.name + '(' + v + ')');
    });
    ['AE','AT','EA'].forEach(sh => {
      if (!covered.has(sh)) {
        violations.push({
          rule: '班別人力不足',
          日期: d + '日',
          缺少班別: sh,
          上班人員: working.join(' ') || '無',
          休假人員: resting.join(' ') || '無'
        });
      }
    });
  }

  if (violations.length > 0) {
    console.table(violations);
    showToast('排班完成，但仍有 ' + violations.length + ' 個規則衝突，請查看紅框');
  } else {
    showToast('一鍵排班完成！');
  }
}

function wouldExceedMaxConsecutiveWork(staffId, day, newVal, days) {
  if (!isWork(newVal)) return false;
  let before = 0, after = 0;
  for (let dd = day - 1; dd >= 1; dd--) {
    if (isWork(state.cells[cellKey(staffId, dd)] || '')) before++;
    else break;
  }
  for (let dd = day + 1; dd <= days; dd++) {
    if (isWork(state.cells[cellKey(staffId, dd)] || '')) after++;
    else break;
  }
  return (before + 1 + after) > 5;
}

function wouldCreateAutoRestOver2(staffId, day, newVal, days) {
  if (!OFF.includes(newVal) && !SICK.includes(newVal)) return false;
  const key = cellKey(staffId, day);
  if (state.edited.has(key)) return false;
  let before = 0;
  for (let dd = day - 1; dd >= 1; dd--) {
    const k = cellKey(staffId, dd);
    const v = state.cells[k] || '';
    if ((OFF.includes(v) || SICK.includes(v)) && !state.edited.has(k)) before++;
    else break;
  }
  let after = 0;
  for (let dd = day + 1; dd <= days; dd++) {
    const k = cellKey(staffId, dd);
    const v = state.cells[k] || '';
    if ((OFF.includes(v) || SICK.includes(v)) && !state.edited.has(k)) after++;
    else break;
  }
  return (before + 1 + after) > 2;
}

function canAutoSetCell(staff, day, newVal, days) {
  const key = cellKey(staff.id, day);
  if (state.edited.has(key)) return false;
  if (isWork(newVal)) {
    if (!checkElevenHours(staff.id, day, newVal, days)) return false;
    if (wouldExceedMaxConsecutiveWork(staff.id, day, newVal, days)) return false;
    if (staff.type === 'PT') {
      let cnt = 0;
      for (let d = 1; d <= days; d++) {
        if (d === day) continue;
        if (isWork(state.cells[cellKey(staff.id, d)] || '')) cnt++;
      }
      if (cnt >= 15) return false;
    }
    return true;
  }
  if (OFF.includes(newVal) || SICK.includes(newVal)) {
    if (wouldCreateAutoRestOver2(staff.id, day, newVal, days)) return false;
    return true;
  }
  return true;
}

function checkAdjacent(v1, v2) {
  // 檢查兩個相鄰班別是否合法（11h）
  if (!v1 || !v2) return true;
  if ((v1==='AT' && v2==='AE')) return false;
  if ((v1==='AE' && v2==='EA')) return false;
  if ((v1==='EA' && (v2==='AT'||v2==='AE'))) return false;
  return true;
}

function whichShift(v) {
  if (['AE','AT','EA'].includes(v)) return v;
  if (!v.includes('-')) return null;
  const [s, e] = v.split('-').map(t => parseInt(t));
  if (s <= 900 && e >= 1500) return 'AE';
  if (s >= 1300 && s <= 1600 && e >= 2230) return 'AT';
  if (s >= 2100) return 'EA';
  return null; // 額外人力，不覆蓋任何班
}

function recomputeCovered(covered, days) {
  for (let d = 1; d <= days; d++) covered[d].clear();
  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const v = state.cells[cellKey(s.id, d)] || '';
      const sh = whichShift(v);
      if (sh) covered[d].add(sh);
    }
  });
}

function ptWeekCount(staffId, day, days) {
  // 計算 day 所在自然週（週一到週日）PT已上幾天
  const date = new Date(state.year, state.month-1, day);
  const dow = date.getDay(); // 0=日
  const offsetToMon = dow === 0 ? -6 : -(dow - 1);
  const monDay = day + offsetToMon;
  let count = 0;
  for (let i = 0; i < 7; i++) {
    const d = monDay + i;
    if (d < 1 || d > days) continue;
    if (d === day) continue;
    const v = state.cells[cellKey(staffId, d)] || '';
    if (isWork(v)) count++;
  }
  return count;
}

function findFirstMonday() {
  for (let d = 1; d <= 7; d++) {
    if (dayOfWeek(state.year, state.month, d) === 1) return d;
  }
  return 1;
}

// 整合調整：不連上6 + 不連休3 + 兩週至少4天 + 平均分布
function adjustOffDays(offDays, days, fixedOff, totalOff) {
  // 策略：直接用「理想分布」演算法重新生成休假日，盡量平均分散
  // 先保留 fixedOff，再從剩餘天中均勻挑選

  const need = totalOff - fixedOff.length;
  if (need <= 0) return [...fixedOff].sort((a,b)=>a-b);

  // 可選的天（不含 fixedOff）
  const candidates = [];
  for (let d = 1; d <= days; d++) {
    if (!fixedOff.includes(d)) candidates.push(d);
  }

  // 計算違規分數（越低越好）
  function score(arr) {
    let v = 0;
    const set = new Set(arr);
    // 連續工作 > 5：嚴重
    let streak = 0;
    for (let d = 1; d <= days; d++) {
      if (!set.has(d)) { streak++; if (streak > 5) v += 1000 * (streak - 5); }
      else streak = 0;
    }
    // 連續休假 > 2（非手動）：嚴重
    let offStreak = 0, offStart = 1;
    for (let d = 1; d <= days; d++) {
      if (set.has(d)) {
        if (offStreak === 0) offStart = d;
        offStreak++;
        if (offStreak > 2) {
          let auto = true;
          for (let i = offStart; i <= d; i++) if (fixedOff.includes(i)) auto = false;
          if (auto) v += 500 * (offStreak - 2);
        }
      } else offStreak = 0;
    }
    // 兩週4天：嚴重
    const firstMon = findFirstMonday();
    for (let start = firstMon; start + 13 <= days; start += 14) {
      const cnt = arr.filter(d => d >= start && d <= start + 13).length;
      if (cnt < 4) v += 800 * (4 - cnt);
    }
    // 平均分布：休假日間隔的標準差越小越好
    const sorted = [...arr].sort((a,b)=>a-b);
    const gaps = [];
    for (let i = 1; i < sorted.length; i++) gaps.push(sorted[i] - sorted[i-1]);
    if (gaps.length > 0) {
      const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
      const variance = gaps.reduce((s,g)=>s+(g-avg)**2, 0) / gaps.length;
      v += variance * 2;
    }
    return v;
  }

  // 起始：均勻分布的休假日
  const step = days / totalOff;
  let result = [...fixedOff];
  for (let i = 0; result.length < totalOff; i++) {
    const d = Math.round((i + 0.5) * step);
    if (d >= 1 && d <= days && !result.includes(d) && !fixedOff.includes(d)) {
      result.push(d);
    }
  }
  // 補不夠的
  for (const d of candidates) {
    if (result.length >= totalOff) break;
    if (!result.includes(d)) result.push(d);
  }
  result = result.slice(0, totalOff).sort((a,b)=>a-b);

  // 局部搜尋：嘗試所有交換，取分數最低
  let safety = 0;
  while (safety++ < 500) {
    const baseS = score(result);
    let bestSwap = null;
    let bestS = baseS;

    for (const offDay of result) {
      if (fixedOff.includes(offDay)) continue;
      for (let workDay = 1; workDay <= days; workDay++) {
        if (result.includes(workDay)) continue;
        if (fixedOff.includes(workDay)) continue;
        const trial = result.filter(x => x !== offDay).concat([workDay]);
        const s = score(trial);
        if (s < bestS) {
          bestS = s;
          bestSwap = { from: offDay, to: workDay };
        }
      }
    }
    if (!bestSwap) break;
    result = result.filter(x => x !== bestSwap.from);
    result.push(bestSwap.to);
    result.sort((a,b)=>a-b);
  }

  return result.sort((a,b)=>a-b);
}

// ===== 輔助函式 =====
function coversShift(timeStr, startH, endH) {
  if (!timeStr.includes('-')) return false;
  const [s, e] = timeStr.split('-').map(t => parseInt(t.slice(0,2)));
  return s <= startH && e >= endH;
}

function missingShifts(day, days) {
  const covered = new Set();
  state.staff.forEach(s => {
    const v = state.cells[cellKey(s.id, day)] || '';
    if (v === 'AE' || coversShift(v,7,15)) covered.add('AE');
    if (v === 'AT' || coversShift(v,14,23)) covered.add('AT');
    if (v === 'EA' || coversShift(v,22,7))  covered.add('EA');
  });
  return ['AE','AT','EA'].filter(sh => !covered.has(sh));
}

function checkElevenHours(staffId, day, shift, days) {
  const prevV = day > 1 ? (state.cells[cellKey(staffId, day-1)]||'') : '';
  const nextV = day < days ? (state.cells[cellKey(staffId, day+1)]||'') : '';

  // 禁止組合：AT>AE, AE>EA, EA>AT, EA>AE
  const illegal = [
    ['AT','AE'], // 晚接早
    ['AE','EA'], // 早接大夜
    ['EA','AT'], // 大夜接晚
    ['EA','AE'], // 大夜接早
  ];
  for (const [prev, next] of illegal) {
    if (prevV === prev && shift === next) return false;
    if (shift === prev && nextV === next) return false;
  }

  // 自訂時間也要檢查
  if (prevV && !['AE','AT','EA',...ALL_OFF].includes(prevV)) {
    const prevEnd = getEndHour(prevV);
    const shiftStartH = shift==='AE'?7:shift==='AT'?14:22;
    const prevEndH = prevEnd > 12 ? prevEnd : prevEnd + 24;
    const startH = shiftStartH < 12 ? shiftStartH + 24 : shiftStartH;
    if (startH - prevEndH < 11) return false;
  }
  return true;
}

function getEndHour(timeStr) {
  if (!timeStr.includes('-')) return 23;
  const e = timeStr.split('-')[1];
  return parseInt(e.slice(0,2));
}

function shiftCovered(day, shift) {
  return state.staff.some(s => {
    const v = state.cells[cellKey(s.id, day)] || '';
    if (v === shift) return true;
    if (!v.includes('-')) return false;
    const parts = v.split('-');
    const sh = parseInt(parts[0]);
    const eh = parseInt(parts[1]);
    if (shift === 'AE') return sh <= 700 && eh >= 1530;
    if (shift === 'AT') return sh <= 1430 && eh >= 2300;
    if (shift === 'EA') return sh >= 2200 || eh <= 700;
    return false;
  });
}

function spreadOffDays(offDays, days, totalOff) {
  // 平均分散休假日，確保不連6，且嚴格等於 totalOff 天
  // 先從所有天中選出最均勻的 totalOff 個休假日
  const allDays = Array.from({length: days}, (_, i) => i + 1);
  
  // 固定已手動標記的假日（事年病）
  const fixed = offDays.filter(d => {
    const v = state.cells[cellKey('_check', d)]; // 只是佔位
    return true; // 全部保留
  });
  
  // 用間隔法選出 totalOff 個休假日
  let result = [...offDays].slice(0, totalOff);
  
  // 如果不夠，補到 totalOff
  if (result.length < totalOff) {
    const step = Math.floor(days / (totalOff + 1));
    for (let i = 1; result.length < totalOff; i++) {
      const d = Math.min(i * step, days);
      if (!result.includes(d)) result.push(d);
    }
  }
  
  // 確保不連6：掃描並移動休假日
  result = result.sort((a,b)=>a-b).slice(0, totalOff);
  let changed = true, safety = 0;
  while (changed && safety++ < 100) {
    changed = false;
    result.sort((a,b)=>a-b);
    let streak = 0, streakStart = 1;
    for (let d = 1; d <= days; d++) {
      if (!result.includes(d)) {
        if (streak === 0) streakStart = d;
        streak++;
        if (streak >= 6) {
          // 把最遠的休假日移到 streakStart+4
          const target = streakStart + 4;
          if (!result.includes(target)) {
            // 找一個可以移動的休假日（不在連續工作段內）
            const movable = result.find(x => x > target + 2);
            if (movable) {
              result = result.filter(x => x !== movable);
              result.push(target);
              changed = true;
              break;
            }
          }
        }
      } else {
        streak = 0;
      }
    }
  }
  return result.sort((a,b)=>a-b).slice(0, totalOff);
}

function ensureNoSix(offDays, days, totalOff) {
  // 掃描連續上班天數，超過5天就插入休假
  const off = new Set(offDays);
  let changed = true;
  while (changed) {
    changed = false;
    let streak = 0, streakStart = 0;
    for (let d = 1; d <= days; d++) {
      if (!off.has(d)) {
        if (streak === 0) streakStart = d;
        streak++;
        if (streak > 5) {
          // 在第5天後插入休假
          const insertDay = streakStart + 4;
          off.add(insertDay);
          changed = true;
          break;
        }
      } else {
        streak = 0;
      }
    }
  }
  return [...off].sort((a,b)=>a-b);
}

function ensureBiweekly(offDays, days) {
  const off = new Set(offDays);
  for (let w = 0; w < Math.ceil(days/14); w++) {
    const start = w*14+1, end = Math.min(start+13, days);
    const weekOff = [...off].filter(d => d>=start && d<=end);
    if (weekOff.length < 4) {
      for (let d = start; d <= end && weekOff.length < 4; d++) {
        if (!off.has(d)) { off.add(d); offDays.push(d); weekOff.push(d); }
      }
    }
  }
}

// ===== RENDER =====
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function dayOfWeek(y, m, d) { return new Date(y, m-1, d).getDay(); } // 0=日
const WD = ['日','一','二','三','四','五','六'];
const SHIFTS = ['AE','AT','EA'];

// 寬鬆班別對照表：常用自訂時段對應到固定班別
// ===== 員工資料正規化 =====

function normalizeStaffSettings(staffList) {
  // SLOT_CONFIG fallback（migration 用，Phase B 後可移除）
  const legacyConfig = {
    'P150802': { ptMode: 'fixed', mainSlot: null,  slotTimes: { AE: '0700-1500', AT: '1600-2230' }, priorityBySlot: { AE: 0, AT: 0 } },
    'P260201': { ptMode: 'flex',  mainSlot: null,  slotTimes: { AE: '0700-1530', AT: '1430-2300', EA: '2230-0700' }, priorityBySlot: { AE: 3, AT: 3, EA: 2 } },
    'K250901': { ptMode: null,    mainSlot: 'EA',  slotTimes: { EA: '2230-0700' }, priorityBySlot: { EA: 1 } },
    'K250601': { ptMode: null,    mainSlot: 'AE',  slotTimes: { AE: '0700-1530', AT: '1430-2300' }, priorityBySlot: { AE: 1, AT: 2 } },
    'K250603': { ptMode: null,    mainSlot: 'AT',  slotTimes: { AE: '0700-1530', AT: '1430-2300' }, priorityBySlot: { AE: 2, AT: 1 } },
    'K230101': { ptMode: null,    mainSlot: 'AE',  slotTimes: { AE: '0700-1530', AT: '1430-2300', EA: '2230-0700' }, priorityBySlot: { AE: 4, AT: 4, EA: 3 } },
  };

  return staffList.map(s => {
    const legacy = legacyConfig[s.id] || {};

    // 已有新格式就保留，否則從 legacy 補
    const ptMode         = s.ptMode         ?? legacy.ptMode         ?? null;
    // fixed PT 不需要 mainSlot（不被 autoSchedule 主動排班）
    const mainSlot = ptMode === 'fixed'
      ? null
      : (s.mainSlot ?? legacy.mainSlot ?? (s.canShifts?.[0] || null));
    const slotTimes      = s.slotTimes      ?? legacy.slotTimes      ?? {};
    const priorityBySlot = s.priorityBySlot ?? legacy.priorityBySlot ?? {};

    // slotTimes fallback：canShifts 裡沒有設定的 slot 補預設值
    const defaultTimes = { AE: '0700-1530', AT: '1430-2300', EA: '2230-0700' };
    const mergedSlotTimes = { ...slotTimes };
    (s.canShifts || []).forEach(sl => {
      if (!mergedSlotTimes[sl]) mergedSlotTimes[sl] = defaultTimes[sl] || '';
    });

    return {
      ...s,
      ptMode,
      mainSlot,
      slotTimes: mergedSlotTimes,
      priorityBySlot,
    };
  });
}

// ===== SLOT CONFIG：每位員工的班別設定與預設時間 =====
const SLOT_CONFIG = {
  'P150802': {
    ptMode: 'fixed',
    slots: { AE: '0700-1500', AT: '1600-2230' }
  },
  'P260201': {
    ptMode: 'flex',
    slots: { AE: '0700-1530', AT: '1430-2300', EA: '2230-0700' }
  },
  'K250901': {
    mainSlot: 'EA',
    slots: { EA: '2230-0700' }
  },
  'K250601': {
    mainSlot: 'AE',
    slots: { AE: '0700-1530', AT: '1430-2300' }
  },
  'K250603': {
    mainSlot: 'AT',
    slots: { AE: '0700-1530', AT: '1430-2300' }
  },
  'K230101': {
    mainSlot: 'AE',
    slots: { AE: '0700-1530', AT: '1430-2300', EA: '2230-0700' }
  },
};

// 取得員工 slot 設定，優先讀 staff 自身資料，fallback 到 SLOT_CONFIG
function getSlotConfigForStaff(staff) {
  // 優先用 normalize 後的 staff 資料
  if (staff.slotTimes) {
    return {
      ptMode:  staff.ptMode  || null,
      mainSlot: staff.mainSlot || null,
      slots:   staff.slotTimes,
    };
  }
  // fallback：舊版 SLOT_CONFIG（migration 期間保留）
  const config = SLOT_CONFIG[staff.id];
  if (config) return config;
  // 最後 fallback：canShifts 預設時間
  const slots = {};
  (staff.canShifts || []).forEach(slot => {
    if (slot === 'AE') slots.AE = '0700-1530';
    if (slot === 'AT') slots.AT = '1430-2300';
    if (slot === 'EA') slots.EA = '2230-0700';
  });
  return {
    ptMode:   staff.type === 'PT' ? 'flex' : null,
    mainSlot: staff.mainSlot || (staff.canShifts || [])[0] || null,
    slots
  };
}

// 取得某員工排某班的實際時間區間
// value = 'AE'/'AT'/'EA' → 用 SLOT_CONFIG defaultTime
// value = '0700-1500' 等時間格式 → 直接 parseTimeRange
function getAssignmentTime(staff, value) {
  if (!value || OFF.includes(value) || SICK.includes(value)) return null;
  if (SHIFTS.includes(value)) {
    const cfg = getSlotConfigForStaff(staff);
    const timeStr = cfg.slots[value];
    if (timeStr) return parseTimeRange(timeStr);
    return SHIFT_DEFS[value]
      ? { startMin: SHIFT_DEFS[value].startMin, endMin: SHIFT_DEFS[value].endMin }
      : null;
  }
  return parseTimeRange(value);
}

const LOOSE_SLOT_ALIASES = {
  AE: ['AE', '0700-1500', '0700-1530', '0700-1600'],
  AT: ['AT', '1430-2300', '1530-2230', '1600-2230'],
  EA: ['EA', '2230-0700', '2200-0700', '2230-0800'],
};

function getLooseCoveredSlot(value) {
  if (!value) return null;
  if (OFF.includes(value) || SICK.includes(value)) return null;
  for (const [slot, aliases] of Object.entries(LOOSE_SLOT_ALIASES)) {
    if (aliases.includes(value)) return slot;
  }
  // 不在對照表的自訂時段：回傳 null（例如 1030-1430）
  return null;
}

const SHIFT_DEFS = {
  AE: { code:'AE', label:'早班', startMin:420,  endMin:930  },
  AT: { code:'AT', label:'晚班', startMin:870,  endMin:1380 },
  EA: { code:'EA', label:'大夜', startMin:1350, endMin:1860 },
};

function parseTimeRange(value) {
  if (!value || !value.includes('-')) return null;
  const parts = value.split('-');
  if (parts.length !== 2) return null;
  const parseMin = t => {
    const s = t.trim().padStart(4,'0');
    return parseInt(s.slice(0,2)) * 60 + parseInt(s.slice(2,4));
  };
  let startMin = parseMin(parts[0]);
  let endMin   = parseMin(parts[1]);
  if (endMin <= startMin) endMin += 1440; // 跨日延伸
  return { startMin, endMin };
}

function getShiftInfo(value) {
  if (!value) return null;
  if (SHIFT_DEFS[value]) return SHIFT_DEFS[value];
  const range = parseTimeRange(value);
  if (!range) return null;
  return { code: null, label: value, startMin: range.startMin, endMin: range.endMin };
}

function getCoveredSlot(value) {
  if (!value) return null;
  if (SHIFT_DEFS[value]) return value; // AE / AT / EA 直接回傳
  const range = parseTimeRange(value);
  if (!range) return null;
  for (const [code, def] of Object.entries(SHIFT_DEFS)) {
    if (range.startMin <= def.startMin && range.endMin >= def.endMin) return code;
  }
  return null; // 不完整覆蓋任何固定班別
}

function getAssignmentIntervalAbs(staff, value, day) {
  if (!value || OFF.includes(value) || SICK.includes(value)) return null;
  let startMin, endMin;
  if (SHIFTS.includes(value)) {
    const cfg = getSlotConfigForStaff(staff);
    const timeStr = cfg.slots[value];
    const range = timeStr ? parseTimeRange(timeStr) : null;
    if (range) { startMin = range.startMin; endMin = range.endMin; }
    else {
      const def = SHIFT_DEFS[value];
      if (!def) return null;
      startMin = def.startMin; endMin = def.endMin;
    }
  } else {
    const range = parseTimeRange(value);
    if (!range) return null;
    startMin = range.startMin; endMin = range.endMin;
  }
  // endMin 已由 parseTimeRange 處理跨日（+1440），這裡再轉成絕對分鐘
  const startAbs = (day - 1) * 1440 + startMin;
  const endAbs   = (day - 1) * 1440 + endMin;
  return { startAbs, endAbs };
}

function hasElevenHourRestByDay(staff, prevValue, prevDay, nextValue, nextDay) {
  if (!prevValue || !nextValue) return true;
  if (!isWork(prevValue) || !isWork(nextValue)) return true;
  const prev = getAssignmentIntervalAbs(staff, prevValue, prevDay);
  const next = getAssignmentIntervalAbs(staff, nextValue, nextDay);
  if (!prev || !next) return true;
  return (next.startAbs - prev.endAbs) >= 660;
}

function hasElevenHourRest(prevValue, nextValue, prevStaff, nextStaff) {
  if (!prevValue || !nextValue) return true;
  // 優先用 getAssignmentTime（含員工個別 defaultTime）
  const prev = prevStaff ? getAssignmentTime(prevStaff, prevValue) : getShiftInfo(prevValue);
  const next = nextStaff ? getAssignmentTime(nextStaff, nextValue) : getShiftInfo(nextValue);
  if (!prev || !next) return true;
  let nextStart = next.startMin;
  if (nextStart <= prev.endMin) nextStart += 1440;
  return (nextStart - prev.endMin) >= 660;
}

function isForbiddenShiftPair(prevValue, nextValue) {
  const forbidden = [
    ['AT','AE'],
    ['EA','AE'],
    ['EA','AT'],
  ];
  for (const [p, n] of forbidden) {
    if (prevValue === p && nextValue === n) return true;
  }
  return false;
}
const OFF = ['例','休','國'];
const SICK = ['事','年','病'];
const ALL_OFF = [...OFF, ...SICK];

function isWork(v) { return v && !ALL_OFF.includes(v); }
function isSick(v) { return SICK.includes(v); }
function isOff(v)  { return OFF.includes(v); }

function initRowDrag() {
  let dragSrcId = null;

  document.querySelectorAll('[data-staff-drag]').forEach(td => {
    td.addEventListener('dragstart', e => {
      dragSrcId = td.dataset.staffDrag;
      td.closest('tr').style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    td.addEventListener('dragend', e => {
      td.closest('tr').style.opacity = '';
      document.querySelectorAll('#table-body tr').forEach(tr => tr.classList.remove('drag-row-over'));
    });
    td.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const targetId = td.dataset.staffDrag;
      if (targetId === dragSrcId) return;
      document.querySelectorAll('#table-body tr').forEach(tr => tr.classList.remove('drag-row-over'));
      td.closest('tr').classList.add('drag-row-over');
    });
    td.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = td.dataset.staffDrag;
      if (!dragSrcId || targetId === dragSrcId) return;
      const srcIdx = state.staff.findIndex(s => s.id === dragSrcId);
      const tgtIdx = state.staff.findIndex(s => s.id === targetId);
      if (srcIdx === -1 || tgtIdx === -1) return;
      const [removed] = state.staff.splice(srcIdx, 1);
      state.staff.splice(tgtIdx, 0, removed);
      state.unsaved = true;
      setSaveStatus('有未儲存的變更');
      renderTable();
      renderStats();
    });
  });
}

function buildCellClass(val, isWend, key) {
  let cls = 'cell';
  if (isWend) cls += ' td-wend';
  if (OFF.includes(val)) cls += ' c-off';
  else if (SICK.includes(val)) cls += ' c-sick';
  if (state.showEdited && state.edited.has(key)) cls += ' c-edited';
  return cls;
}

function setCellContent(td, val) {
  if (!val) { td.textContent = ''; return; }
  if (SHIFTS.includes(val) || ALL_OFF.includes(val)) {
    td.textContent = val; return;
  }
  // custom time e.g. "0700-1500"
  const parts = val.split('-');
  if (parts.length === 2) {
    td.innerHTML = `<div class="time-cell"><span>${parts[0]}</span><span>${parts[1]}</span></div>`;
  } else {
    td.textContent = val;
  }
}
// ===== CELL INTERACTION =====
function onCellClick(td, staffId, day) {
  const key = cellKey(staffId, day);
  const oldVal = state.cells[key] || '';
  const newVal = state.currentMode;
  // 點有內容的格子直接清空
  if (oldVal && oldVal === newVal) {
    delete state.cells[key];
      td.className = buildCellClass('', td.classList.contains('td-wend'), key);
    setCellContent(td, '');
    state.unsaved = true; setSaveStatus('有未儲存的變更');
    updateSumCell(day); renderStats(); renderWarnings();
    return;
  }
  if (oldVal && newVal && oldVal !== newVal) {
    // 有內容點不同模式 → 覆蓋
  } else if (oldVal && !newVal) {
    delete state.cells[key];
  }
  state.cells[key] = newVal || undefined;
  if (!newVal) delete state.cells[key];
  td.className = buildCellClass(newVal, td.classList.contains('td-wend'), key);
  setCellContent(td, newVal);
  state.unsaved = true;
  setSaveStatus('有未儲存的變更');
  updateSumCell(day);
  renderStats();
  renderWarnings();
}

function pushHistory(desc, count) {
  state.history.push(JSON.stringify(state.cells));
  if (state.history.length > 30) state.history.shift();
  document.getElementById('undo-btn').disabled = false;
  document.getElementById('undo-btn').style.opacity = '1';
  // 修改紀錄
  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  state.changeLog.unshift(`${timeStr} ${desc}${count ? ` ${count}筆` : ''}`);
  if (state.changeLog.length > 5) state.changeLog.pop();
  document.getElementById('change-log').textContent = state.changeLog.join('　|　');
}

document.getElementById('undo-btn').addEventListener('click', () => {
  if (!state.history.length) return;
  state.cells = JSON.parse(state.history.pop());

    document.getElementById('undo-btn').disabled = true;
    document.getElementById('undo-btn').style.opacity = '0.4';

  showToast('已復原');
  scheduleAutoSave();
});



function refreshColWarnState() {
  const days = daysInMonth(state.year, state.month);
  // 先清除所有舊的 col-warn
  document.querySelectorAll('.col-warn').forEach(el => el.classList.remove('col-warn'));
  // 重新掃每一天
  for (let d = 1; d <= days; d++) {
    const cnt = state.staff.filter(s => isWork(state.cells[cellKey(s.id, d)])).length;
    if (cnt === 3 || cnt === 0) continue;
    // 標記 header
    document.querySelectorAll('#table-head th').forEach(th => {
      if (parseInt(th.dataset.day) === d) th.classList.add('col-warn');
    });
    // 標記 body cells
    document.querySelectorAll(`[data-day="${d}"]`).forEach(td => {
      td.classList.add('col-warn');
    });
  }
}

function updateSumCell(day) {
  const cnt = state.staff.filter(s => isWork(state.cells[cellKey(s.id, day)])).length;
  const sumRow = document.querySelector('.sum-row');
  if (!sumRow) return;
  // fixed cols = 3, so day col index = day+2 (0-indexed)

function renderPTSalary() {
  const HOURLY_WAGE = 196; // 115年基本時薪
  const days = daysInMonth(state.year, state.month);
  const pts = state.staff.filter(s => s.type === 'PT');
  const area = document.getElementById('pt-salary');
  if (!area) return;
  area.innerHTML = '';
  let totalHours = 0;
  let totalWage = 0;
  pts.forEach(s => {
    let hours = 0;
    for (let d = 1; d <= days; d++) {
      const v = state.cells[cellKey(s.id, d)] || '';
      if (!isWork(v)) continue;
      hours += shiftHours(v);
    }
    const wage = Math.round(hours * HOURLY_WAGE);
    totalHours += hours;
    totalWage += wage;
    const span = document.createElement('span');
    span.innerHTML = `<b>${s.name}</b> ${hours.toFixed(1)}h $${wage.toLocaleString()}`;
    area.appendChild(span);
  });
  if (pts.length > 0) {
    const total = document.createElement('span');
    total.style.marginLeft = 'auto';
    total.style.fontWeight = '500';
    total.innerHTML = `合計 ${totalHours.toFixed(1)}h $${totalWage.toLocaleString()} <span style="font-size:14px;color:#9a9080">(時薪$${HOURLY_WAGE})</span>`;
    area.appendChild(total);
  }
}

function shiftHours(v) {
  if (v === 'AE') return 8;   // 07-15:30 扣30分休息 = 8h
  if (v === 'AT') return 8;   // 14:30-23:00
  if (v === 'EA') return 8;   // 22:30-07:00
  if (!v.includes('-')) return 0;
  const [sh, eh] = v.split('-').map(t => parseInt(t));
  const sM = Math.floor(sh/100)*60 + sh%100;
  let eM = Math.floor(eh/100)*60 + eh%100;
  if (eM <= sM) eM += 24*60; // 跨午夜
  let hours = (eM - sM) / 60;
  if (hours > 6) hours -= 0.5; // 超過6小時扣30分鐘休息
  return hours;
}
function getQuota() {
  return {
    li:  parseInt(document.getElementById('quota-li')?.value)||5,
    xi:  parseInt(document.getElementById('quota-xi')?.value)||5,
    guo: parseInt(document.getElementById('quota-guo')?.value)||1,
  };
}

// ===== LABOUR LAW VALIDATION =====
function renderWarnings() {
  const warns = [];
  const days = daysInMonth(state.year, state.month);
  const table = document.getElementById('table-body');
  // clear old warn outlines
  table.querySelectorAll('.c-warn').forEach(td => td.classList.remove('c-warn'));

  state.staff.forEach(s => {
    // 1. 連續上班 > 5天
    let streak = 0, streakStart = 0;
    for (let d = 1; d <= days; d++) {
      const v = state.cells[cellKey(s.id, d)] || '';
      if (isWork(v)) {
        if (streak === 0) streakStart = d;
        streak++;
        if (streak > 5) {
          warns.push({
            msg:`${s.name} 連續上班第${streak}天（${streakStart}日～${d}日）`,
            staffId:s.id,
            cells: range(streakStart, d).map(day => ({ staffId: s.id, day }))
          });
          markWarn(s.id, d);
        }
      } else if (OFF.includes(v) || !v) {
        streak = 0;
      }
      // 病/事/年不中斷連續計算
    }

    // 2. 禁止班別組合警告
    const illegalPairs = [
      ['AT','AE','晚接早'],
      ['EA','AT','大夜接晚'], ['EA','AE','大夜接早'],
    ];
    for (let d = 1; d < days; d++) {
      const v1 = state.cells[cellKey(s.id, d)] || '';
      const v2 = state.cells[cellKey(s.id, d+1)] || '';
      for (const [prev, next, label] of illegalPairs) {
        if (v1 === prev && v2 === next) {
          warns.push({
            msg:`${s.name} ${d}日→${d+1}日 ${label}`,
            cells: [{ staffId: s.id, day: d }, { staffId: s.id, day: d+1 }]
          });
          markWarn(s.id, d); markWarn(s.id, d+1);
        }
      }
    }

    // 3. 兩週內例+休 < 4天（只檢查正職，PT空白格視為休假不列入）
    if (s.type === '正職') {
      for (let w = 0; w < Math.ceil(days/14); w++) {
        const start = w*14+1, end = Math.min(start+13, days);
        let offCount = 0;
        for (let d = start; d <= end; d++) {
          const v = state.cells[cellKey(s.id, d)] || '';
          if (OFF.includes(v)) offCount++;
        }
        const filledDays = Array.from({length: end-start+1}, (_,i)=>start+i).filter(d => state.cells[cellKey(s.id, d)]).length;
        if (offCount < 4 && end - start >= 13 && filledDays >= 10) {
          warns.push({
            msg:`${s.name} 第${w+1}個兩週期例休不足4天（僅${offCount}天）`,
            cells: range(start, end).map(day => ({ staffId: s.id, day }))
          });
        }
      }
    }
  });

  // render warn badges
  const area = document.getElementById('warn-area');
  area.innerHTML = '';
  warns.slice(0, 5).forEach(w => {
    const badge = document.createElement('div');
    badge.className = 'warn-badge';
    badge.textContent = '⚠ ' + w.msg;
    badge.addEventListener('click', () => {
      // 清除所有警告紅框
      document.querySelectorAll('.c-warn').forEach(el => el.classList.remove('c-warn'));
      // 框出相關格子
      if (w.cells) {
        w.cells.forEach(({ staffId, day }) => markWarn(staffId, day));
      }
    });
    area.appendChild(badge);
  });
  if (warns.length > 5) {
    const more = document.createElement('div');
    more.className = 'warn-badge';
    more.textContent = `+${warns.length-5} 項警示`;
    area.appendChild(more);
  }
}

function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}

function markWarn(staffId, day) {
  const td = document.querySelector(`[data-staff="${staffId}"][data-day="${day}"]`);
  if (td) td.classList.add('c-warn');
}

function endsLate(v) {
  if (v === 'AT') return true;
  if (!v) return false;
  const parts = v.split('-');
  if (parts.length === 2) {
    const end = parseInt(parts[1]);
    return end >= 2300 || end <= 200; // 跨午夜
  }
  return false;
}

function startsEarly(v) {
  if (v === 'AE') return true;
  if (!v) return false;
  const parts = v.split('-');
  if (parts.length === 2) {
    const start = parseInt(parts[0]);
    return start <= 900;
  }
  return false;
}

// 修改員編
window.openChangeId = function(oldId) {
  const newId = prompt(`請輸入新員編（目前：${oldId}）`);
  if (!newId || !newId.trim()) return;
  const trimmed = newId.trim();
  if (state.staff.find(x => x.id === trimmed)) {
    alert('員編已存在！');
    return;
  }
  try {
    // 替換 staff
    const s = state.staff.find(x => x.id === oldId);
    if (!s) throw new Error('找不到員工');
    s.id = trimmed;
    // 替換 cells
    const days = daysInMonth(state.year, state.month);
    for (let d = 1; d <= days; d++) {
      const oldKey = cellKey(oldId, d);
      const newKey = cellKey(trimmed, d);
      if (state.cells[oldKey] !== undefined) {
        state.cells[newKey] = state.cells[oldKey];
        delete state.cells[oldKey];
      }
      if (state.edited.has(oldKey)) {
        state.edited.delete(oldKey);
        state.edited.add(newKey);
      }
    }
    // 替換 config
    if (state.config[oldId]) {
      state.config[trimmed] = state.config[oldId];
      delete state.config[oldId];
    }
    saveData();
    renderManageStaffModal();
    alert('修改員編成功！');
  } catch(e) {
    console.error(e);
    alert('修改員編失敗！請洽詢開發者');
  }
};

function updatePriorityNumbers(ul) {
  ul.querySelectorAll('.priority-item').forEach((li, i) => {
    li.querySelector('span').textContent = i + 1;
  });
}

function initPriorityDrag(ul) {
  let dragEl = null;
  ul.addEventListener('dragstart', e => {
    dragEl = e.target.closest('.priority-item');
    if (dragEl) dragEl.classList.add('dragging');
  });
  ul.addEventListener('dragend', () => {
    if (dragEl) dragEl.classList.remove('dragging');
    ul.querySelectorAll('.priority-item').forEach(li => li.classList.remove('drag-over'));
    dragEl = null;
    updatePriorityNumbers(ul);
  });
  ul.addEventListener('dragover', e => {
    e.preventDefault();
    const target = e.target.closest('.priority-item');
    if (!target || target === dragEl) return;
    ul.querySelectorAll('.priority-item').forEach(li => li.classList.remove('drag-over'));
    target.classList.add('drag-over');
    const items = [...ul.querySelectorAll('.priority-item')];
    const dragIdx  = items.indexOf(dragEl);
    const targetIdx = items.indexOf(target);
    if (dragIdx < targetIdx) ul.insertBefore(dragEl, target.nextSibling);
    else ul.insertBefore(dragEl, target);
  });
}

  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      if (!state.edited.has(key)) {
        delete state.cells[key];
      }
    }
  });
  state.unsaved = true;
  setSaveStatus('有未儲存的變更');
  renderTable(); renderStats(); renderWarnings();
  showToast('已清除自動排班');
});

document.getElementById('distribute-btn').addEventListener('click', () => {
  if (!confirm('將所有正職的「休」依例→休→例→休順序分配為例/休/國（手動標的不動）')) return;
  pushHistory('分配例休國', null);
  const days = daysInMonth(state.year, state.month);
  const quota = getQuota();
  const seika = state.staff.filter(s => s.type === '正職');
  seika.forEach(s => {
    // 收集所有 OFF 格（不分手動/自動），依日期排序
    const offDays = [];
    for (let d = 1; d <= days; d++) {
      const v = state.cells[cellKey(s.id, d)] || '';
      if (OFF.includes(v)) offDays.push(d);
    }
    // 按 例→休→例→休→...→國 順序重新分配
    let liLeft = quota.li, xiLeft = quota.xi, guoLeft = quota.guo;
    let toggle = 0;
    offDays.forEach(d => {
      const key = cellKey(s.id, d);
      const v = state.cells[key] || '';
      if (!OFF.includes(v)) return; // 只改 OFF 格
      if (toggle === 0 && liLeft > 0) { state.cells[key] = '例'; liLeft--; toggle = 1; }
      else if (toggle === 1 && xiLeft > 0) { state.cells[key] = '休'; xiLeft--; toggle = 0; }
      else if (liLeft > 0) { state.cells[key] = '例'; liLeft--; }
      else if (xiLeft > 0) { state.cells[key] = '休'; xiLeft--; }
      else if (guoLeft > 0) { state.cells[key] = '國'; guoLeft--; }
      // 超出 quota 的維持原值不變
    });
  });
  state.unsaved = true;
  setSaveStatus('有未儲存的變更');
  renderTable(); renderStats(); renderWarnings();
  const days2 = daysInMonth(state.year, state.month);
  finalValidateOfficialOffQuota(days2);
});

document.getElementById('clear-all-btn').addEventListener('click', () => {
  if (!confirm('清除所有人的全部班表？此動作無法復原（可用上一步）')) return;
  pushHistory('清除全部', null);
  state.cells = {};
  state.edited.clear();
  state.unsaved = true;
  setSaveStatus('有未儲存的變更');
  renderTable(); renderStats(); renderWarnings();
  showToast('已清除全部班表');
});
function setSaveStatus(msg) { document.getElementById('save-status').textContent = msg; }

// EXPORT EXCEL
document.getElementById('export-btn').addEventListener('click', exportExcel);
function exportExcel() {
  const days = daysInMonth(state.year, state.month);
  const rows = [];
  // header row 1
  const h1 = [`客務部 ${state.year-1911}年${state.month}月班表`,'',''];
  for(let d=1;d<=days;d++) h1.push(d);
  rows.push(h1);
  // header row 2 weekday
  const h2 = ['員編','姓名','班別'];
  for(let d=1;d<=days;d++) h2.push(WD[dayOfWeek(state.year,state.month,d)]);
  rows.push(h2);
  // staff rows
  state.staff.forEach(s => {
    const row = [s.id, s.name, s.type];
    for(let d=1;d<=days;d++) row.push(state.cells[cellKey(s.id,d)]||'');
    rows.push(row);
  });
  // sum row
  const sumRow = ['','合計人力',''];
  for(let d=1;d<=days;d++) {
    sumRow.push(state.staff.filter(s=>isWork(state.cells[cellKey(s.id,d)])).length||'');
  }
  rows.push(sumRow);

  // Build CSV (BOM for Excel UTF-8)
  const csv = '\uFEFF' + rows.map(r => r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `班表_${state.year-1911}年${state.month}月.csv`;
  a.click();
  showToast('已匯出 CSV（可用 Excel 開啟）');
}

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
