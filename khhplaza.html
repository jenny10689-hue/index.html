<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客務部排班系統</title>
<style>
:root{
  --cell-w:26px;
  --cell-h:45px;
  --fix1-w:36px;
  --fix2-w:44px;
  --fix3-w:34px;
  --fix2-left:36px;
  --fix3-left:80px;
}
@media(max-width:1200px){
  :root{
    --cell-w:22px;
    --cell-h:38px;
    --fix1-w:32px;
    --fix2-w:38px;
    --fix3-w:30px;
    --fix2-left:32px;
    --fix3-left:70px;
  }
}
@media(max-width:900px){
  :root{
    --cell-w:18px;
    --cell-h:32px;
    --fix1-w:28px;
    --fix2-w:34px;
    --fix3-w:28px;
    --fix2-left:28px;
    --fix3-left:62px;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#FAF8F4;color:#2a2820;font-size:18px}
button,select,input{font-family:inherit}

/* ===== LAYOUT ===== */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
#login-screen h1{font-size:18px;font-weight:500;color:#3a3830}
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}
#app.visible{display:flex}

/* ===== TOPBAR ===== */
#topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#F0EDE5;border-bottom:0.5px solid #DDD8CE;flex-shrink:0;flex-wrap:wrap}
#topbar-title{font-weight:500;font-size:18px;color:#3a3830}
.month-sel{padding:3px 7px;border-radius:6px;border:0.5px solid #C8C4BA;font-size:16px;background:#FAF8F4;color:#3a3830;cursor:pointer}
.top-badge{font-size:14px;color:#7a7060;background:#E8E4DA;border-radius:4px;padding:2px 6px;white-space:nowrap}
#warn-area{display:flex;flex-direction:column;gap:3px}
.warn-badge{display:flex;align-items:center;gap:3px;padding:3px 10px;background:#F7C1C1;border:0.5px solid #E24B4A;border-radius:4px;color:#791F1F;font-size:14px;cursor:pointer;width:100%;box-sizing:border-box}
#warn-area:empty{display:none}

/* ===== TOOLBAR ===== */
#toolbar{display:flex;align-items:center;gap:3px;padding:5px 10px;background:#F5F2EA;border-bottom:0.5px solid #DDD8CE;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.tlabel{font-size:14px;color:#9a9080;flex-shrink:0}
.tsep{width:0.5px;height:16px;background:#C8C4BA;margin:0 3px;flex-shrink:0}
.tbtn{padding:3px 7px;border-radius:5px;border:0.5px solid #C8C4BA;background:#FAF8F4;color:#3a3830;cursor:pointer;font-size:15px;font-weight:500;flex-shrink:0;line-height:1.2;min-width:28px;text-align:center;transition:background .1s}
.tbtn:hover{background:#EDE9DF}
.tbtn.act{border-color:#5a5040;background:#3a3830;color:#FAF8F4}
.tbtn-time{font-size:13px;padding:2px 5px;line-height:1.25}
#mode-pill{font-size:14px;color:#5a5040;padding:2px 8px;border-radius:4px;background:#E8E4DA;border:0.5px solid #C8C4BA;white-space:nowrap;flex-shrink:0}

/* ===== INFOBAR ===== */
#infobar{display:flex;align-items:center;gap:10px;padding:4px 10px;background:#F0EDE5;border-bottom:0.5px solid #DDD8CE;flex-shrink:0;overflow-x:auto}
.istat{font-size:14px;color:#7a7060;white-space:nowrap}
.istat b{color:#3a3830}
.istat.warn-stat b{color:#A32D2D}
#infobar-btns{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.ibtn{padding:3px 8px;border-radius:5px;border:0.5px solid #C8C4BA;background:#FAF8F4;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:3px;color:#3a3830;white-space:nowrap}
.ibtn:hover{background:#EDE9DF}
.ibtn-primary{background:#3a3830;color:#FAF8F4;border-color:#3a3830}
.ibtn-primary:hover{background:#5a5040}

/* ===== TABLE ===== */
#table-wrap{overflow:auto;flex:1}
table{border-collapse:collapse;width:max-content;min-width:100%}
thead{position:sticky;top:0;z-index:10}
th{background:#F0EDE5;border:0.5px solid #DDD8CE;padding:3px 2px;text-align:center;font-weight:500;font-size:14px;white-space:nowrap;color:#3a3830}
td{border:0.5px solid #DDD8CE;padding:1px;text-align:center;font-size:14px;white-space:nowrap;color:#2a2820;background:#ffffff}
.th-fix1{text-align:center;padding:3px 2px;min-width:var(--fix1-w);width:var(--fix1-w);position:sticky;left:0;z-index:11;background:#F0EDE5}
.th-fix2{text-align:center;padding:3px 2px;min-width:var(--fix2-w);width:var(--fix2-w);position:sticky;left:var(--fix2-left);z-index:11;background:#F0EDE5}
.th-fix3{min-width:var(--fix3-w);width:var(--fix3-w);position:sticky;left:var(--fix3-left);z-index:11;background:#F0EDE5;font-size:13px}
.td-fix1{text-align:center;padding:2px 2px;font-size:11px;position:sticky;left:0;z-index:5;background:#F5F2EA;color:#7a7060;max-width:var(--fix1-w);width:var(--fix1-w);overflow:hidden;text-overflow:ellipsis}
.td-fix2{text-align:center;padding:2px 2px;font-weight:500;position:sticky;left:var(--fix2-left);z-index:5;background:#F5F2EA;max-width:var(--fix2-w);width:var(--fix2-w);overflow:hidden;text-overflow:ellipsis}
.td-fix3{position:sticky;left:var(--fix3-left);z-index:5;background:#EDE9DF;font-size:13px;color:#7a7060;text-align:center;padding:1px 2px;width:var(--fix3-w);max-width:var(--fix3-w);overflow:hidden;text-overflow:ellipsis}
.th-wend{background:#E8E4DA !important;color:#5a5040}
.td-wend{background:#F5F2EA}
.th-day{min-width:var(--cell-w);width:var(--cell-w)}
.cell{width:var(--cell-w);min-width:var(--cell-w);height:var(--cell-h);cursor:pointer;background:#ffffff;transition:background .1s}
.cell:hover{background:#F0EDE5 !important}
.c-off{background:#D8D5CC !important;color:#3a3830;font-weight:500}
.c-edited{color:#D0242B !important;font-weight:600 !important}
.c-sick{background:#C8C5BC !important;color:#3a3830;font-weight:500}

.c-warn{outline:2px solid #E24B4A !important;outline-offset:-2px}
.col-warn{outline:2px solid #E24B4A;outline-offset:-1px;background:#FEF0F0 !important;}
.time-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;height:100%;font-size:11px;font-weight:500}
.sum-row td{background:#F0EDE5 !important;font-weight:500;border-color:#DDD8CE}
.sum-row .td-fix1,.sum-row .td-fix2,.sum-row .td-fix3{background:#DDD8CE !important}
.del-staff-btn{font-size:13px;color:#C8C4BA;cursor:pointer;padding:0 2px;background:none;border:none;display:none}
.drag-row-over td{background:#E8F4FD !important}
tr:hover .del-staff-btn{display:inline}

/* ===== BOTTOMBAR ===== */
#bottombar{display:flex;gap:10px;padding:5px 10px;background:#F0EDE5;border-top:0.5px solid #DDD8CE;flex-shrink:0;flex-wrap:wrap;align-items:center}
.legend{display:flex;align-items:center;gap:3px;font-size:14px;color:#7a7060}
.lswatch{width:10px;height:10px;border-radius:2px;border:0.5px solid #C8C4BA;flex-shrink:0}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#FAF8F4;border-radius:10px;border:0.5px solid #DDD8CE;padding:20px;min-width:280px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:500;margin-bottom:14px;color:#3a3830}
.modal label{font-size:15px;color:#7a7060;display:block;margin-bottom:3px;margin-top:10px}
.modal input,.modal select{width:100%;padding:6px 8px;border-radius:6px;border:0.5px solid #C8C4BA;font-size:16px;background:#FAF8F4;color:#2a2820}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btns button{padding:5px 14px;border-radius:6px;border:0.5px solid #C8C4BA;cursor:pointer;font-size:16px;background:#FAF8F4;color:#3a3830}
.modal-btns .btn-confirm{background:#3a3830;color:#FAF8F4;border-color:#3a3830}
.modal-btns .btn-danger{background:#F7C1C1;color:#791F1F;border-color:#E24B4A}
.shift-check-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.shift-check-group label{display:flex;align-items:center;gap:4px;font-size:16px;color:#3a3830;cursor:pointer;margin:0}
.shift-check-group input[type=checkbox]{width:auto}
.preset-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.preset-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#F0EDE5;border-radius:6px;border:0.5px solid #DDD8CE}
.preset-item span{flex:1;font-size:16px}
.preset-item button{padding:2px 7px;border-radius:4px;border:0.5px solid #C8C4BA;background:#FAF8F4;font-size:15px;cursor:pointer}
.preset-item .del-preset{color:#A32D2D;border-color:#E24B4A}
.month-config-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.month-config-item label{font-size:15px;color:#7a7060;display:block;margin-bottom:3px}
.month-config-item input{width:100%;padding:5px 6px;border-radius:5px;border:0.5px solid #C8C4BA;font-size:17px;text-align:center;background:#FAF8F4;color:#2a2820}
.priority-list{list-style:none;padding:0;margin:0;min-height:40px;display:flex;flex-direction:column;gap:4px}
.priority-item{padding:5px 8px;background:#F0EDE5;border:0.5px solid #DDD8CE;border-radius:5px;font-size:15px;cursor:grab;user-select:none;display:flex;align-items:center;gap:4px}
.priority-item.dragging{opacity:0.4}
.priority-item.drag-over{border-color:#5a5040;background:#E8E4DA}
.manage-staff-block{border:0.5px solid #DDD8CE;border-radius:8px;padding:12px;margin-bottom:10px;background:#FAFAF8}
.manage-staff-block h4{font-size:16px;font-weight:500;margin-bottom:10px;color:#3a3830;display:flex;align-items:center;gap:8px}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.radio-group label{display:flex;align-items:center;gap:4px;font-size:16px;color:#3a3830;cursor:pointer}
.radio-group input[type=radio]{width:auto}
.field-label{font-size:14px;color:#9a9080;margin-bottom:3px;margin-top:8px;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a3830;color:#FAF8F4;padding:8px 16px;border-radius:8px;font-size:16px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div style="font-size:28px">📋</div>
  <h1>客務部排班系統</h1>
  <p style="font-size:16px;color:#9a9080">KHH Plaza</p>
  <button class="ibtn ibtn-primary" id="login-btn" style="padding:8px 20px;font-size:17px">使用 Google 帳號登入</button>
</div>

<!-- APP -->
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <span id="topbar-title">客務部排班系統</span>
    <select class="month-sel" id="year-sel"></select>
    <select class="month-sel" id="month-sel"></select>
    <input type="number" id="quota-li" min="0" max="31" value="5" style="width:36px;padding:2px 4px;border-radius:4px;border:0.5px solid #C8C4BA;font-size:16px;text-align:center;background:#FAF8F4">
    <label style="font-size:15px;color:#7a7060">例</label>
    <input type="number" id="quota-xi" min="0" max="31" value="5" style="width:36px;padding:2px 4px;border-radius:4px;border:0.5px solid #C8C4BA;font-size:16px;text-align:center;background:#FAF8F4">
    <label style="font-size:15px;color:#7a7060">休</label>
    <input type="number" id="quota-guo" min="0" max="31" value="1" style="width:36px;padding:2px 4px;border-radius:4px;border:0.5px solid #C8C4BA;font-size:16px;text-align:center;background:#FAF8F4">
    <label style="font-size:15px;color:#7a7060">國</label>
    <button class="ibtn ibtn-primary" id="auto-btn">⚡ 一鍵排班</button>
    <button class="ibtn" id="distribute-btn">🎲 分配例休國</button>
    <button class="ibtn" id="manage-staff-btn">👥 管理員工</button>
    <button class="ibtn" id="test-validate-btn" style="color:#5a5040;border-color:#5a5040">🔍 檢查班表</button>
    <button class="ibtn" id="logout-btn" style="margin-left:auto;color:#9a9080">登出</button>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <span class="tlabel">班別</span>
    <button class="tbtn act" data-val="AE" data-mode="AE 早班">AE</button>
    <button class="tbtn" data-val="AT" data-mode="AT 晚班">AT</button>
    <button class="tbtn" data-val="EA" data-mode="EA 大夜">EA</button>
    <div class="tsep"></div>
    <span class="tlabel">休假</span>
    <button class="tbtn" data-val="例" data-mode="例假">例</button>
    <button class="tbtn" data-val="休" data-mode="休息日">休</button>
    <button class="tbtn" data-val="國" data-mode="國定假">國</button>
    <div class="tsep"></div>
    <span class="tlabel">假別</span>
    <button class="tbtn" data-val="事" data-mode="事假">事</button>
    <button class="tbtn" data-val="年" data-mode="年假">年</button>
    <button class="tbtn" data-val="病" data-mode="病假">病</button>
    <div class="tsep"></div>
    <span class="tlabel">常用時段</span>
    <div id="preset-btns"></div>
    <button class="tbtn" id="manage-preset-btn" title="管理常用時段" style="padding:2px 6px;font-size:16px">⚙</button>
    <div class="tsep"></div>
    <button class="tbtn" data-val="" data-mode="清除">清除</button>
    <div class="tsep"></div>
    <div id="mode-pill">模式：AE 早班</div>
  </div>

  <!-- INFOBAR -->
  <div id="infobar">
    <div id="stats-area" style="display:flex;gap:10px;overflow-x:auto"></div>
    <div id="infobar-btns">
      <button class="ibtn" id="undo-btn" style="opacity:0.4" disabled>↩ 上一步</button>
      <button class="ibtn" id="clear-auto-btn" style="color:#A32D2D">🗑 清除自動排班</button>
      <button class="ibtn" id="clear-all-btn" style="color:#A32D2D">🗑 清除全部</button>
      <button class="ibtn" id="export-btn">⬇ 匯出 Excel</button>
      <button class="ibtn ibtn-primary" id="save-btn">💾 儲存</button>
    </div>
  </div>

  <!-- TABLE -->
  <div id="table-wrap">
    <table id="schedule-table">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="warn-area" style="display:flex;flex-direction:column;gap:3px;padding:6px 10px;background:#FEF3F3;border-top:0.5px solid #F7C1C1;min-height:0"></div>
  </div>

  <!-- BOTTOMBAR -->
  <div id="bottombar" style="flex-direction:column;align-items:stretch;padding:6px 10px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="display:flex;gap:10px">
        <div class="legend"><div class="lswatch" style="background:#fff"></div>上班</div>
        <div class="legend"><div class="lswatch" style="background:#D8D5CC"></div>例／休／國</div>
        <div class="legend"><div class="lswatch" style="background:#C8C5BC"></div>事／年／病</div>
        <div class="legend"><div class="lswatch" style="background:#fff;outline:2px solid #E24B4A;outline-offset:-1px"></div>違規</div>
        <label class="legend" style="cursor:pointer;user-select:none">
          <input type="checkbox" id="show-edited-toggle" checked style="margin-right:3px">
          <span style="color:#D0242B;font-weight:600;font-size:14px">紅字</span>
          = 手動畫格，請勿覆蓋
        </label>
      </div>
      <div id="change-log" style="font-size:14px;color:#9a9080;text-align:right"></div>
      <span style="font-size:14px;color:#C8C4BA" id="save-status"></span>
    </div>
    <div id="pt-salary" style="margin-top:4px;padding-top:4px;border-top:0.5px solid #DDD8CE;font-size:15px;color:#3a3830;display:flex;gap:14px;flex-wrap:wrap"></div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL: 新增員工 -->
<div class="modal-overlay" id="modal-add-staff" style="display:none">
  <div class="modal">
    <h3>新增員工</h3>
    <label>員工類型</label>
    <select id="new-staff-type">
      <option value="PT">PT（兼職）</option>
      <option value="正職">正職</option>
      <option value="主管">主管</option>
    </select>
    <div id="pt-mode-row" style="margin-top:10px">
      <label>PT給班模式</label>
      <select id="new-staff-ptmode">
        <option value="rest">給休型（預設可上班，標休=不能上）</option>
        <option value="work">給班型（預設不能上班，手動填時段）</option>
      </select>
    </div>
    <label>員編</label>
    <input id="new-staff-id" placeholder="例：K260101">
    <label>姓名</label>
    <input id="new-staff-name" placeholder="例：王小明">
    <label>可上班別</label>
    <div class="shift-check-group">
      <label><input type="checkbox" value="AE" checked> AE 早班</label>
      <label><input type="checkbox" value="AT" checked> AT 晚班</label>
      <label><input type="checkbox" value="EA"> EA 大夜</label>
    </div>
    <div class="modal-btns">
      <button onclick="closeModal('modal-add-staff')">取消</button>
      <button class="btn-confirm" onclick="confirmAddStaff()">新增</button>
    </div>
  </div>
</div>

<!-- MODAL: 常用時段管理 -->
<div class="modal-overlay" id="modal-presets" style="display:none">
  <div class="modal">
    <h3>常用時段管理</h3>
    <div id="preset-list-ui"></div>
    <div style="display:flex;gap:6px;margin-top:12px">
      <input id="new-preset-input" placeholder="例：0700-1500" style="flex:1;padding:5px 8px;border-radius:5px;border:0.5px solid #C8C4BA;font-size:16px;background:#FAF8F4">
      <button class="ibtn ibtn-primary" onclick="addPreset()">新增</button>
    </div>
    <div class="modal-btns">
      <button class="btn-confirm" onclick="closeModal('modal-presets')">完成</button>
    </div>
  </div>
</div>

<!-- MODAL: 月份設定 -->
<div class="modal-overlay" id="modal-config" style="display:none">
  <div class="modal">
    <h3 id="config-modal-title">月份設定</h3>
    <p style="font-size:15px;color:#9a9080;margin-bottom:8px">設定本月各員工的應休天數</p>
    <div id="config-staff-list"></div>
    <div class="modal-btns">
      <button onclick="closeModal('modal-config')">取消</button>
      <button class="btn-confirm" onclick="saveConfig()">儲存</button>
    </div>
  </div>
</div>

<!-- MODAL: 確認刪除員工 -->
<div class="modal-overlay" id="modal-del-staff" style="display:none">
  <div class="modal">
    <h3>刪除員工</h3>
    <p style="font-size:16px;margin-bottom:8px">確定要刪除 <b id="del-staff-name"></b> 嗎？<br>該員工本月班表資料也會一併刪除。</p>
    <div class="modal-btns">
      <button onclick="closeModal('modal-del-staff')">取消</button>
      <button class="btn-danger" onclick="confirmDelStaff()">確定刪除</button>
    </div>
  </div>
</div>
<!-- MODAL: 管理員工 -->
<div class="modal-overlay" id="modal-manage-staff" style="display:none">
  <div class="modal" style="max-width:480px">
    <h3>管理員工</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button class="ibtn" id="open-priority-btn">📊 班別順位設定</button>
      <button class="ibtn ibtn-primary" id="add-staff-btn2">＋ 新增員工</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <label style="font-size:15px;color:#7a7060;white-space:nowrap">目前員工</label>
      <select id="manage-staff-select" style="flex:1;padding:5px 8px;border-radius:5px;border:0.5px solid #C8C4BA;font-size:16px;background:#FAF8F4"></select>
    </div>
    <div id="manage-staff-card"></div>
    <div class="modal-btns" style="justify-content:space-between">

function autoSchedule() {
  if (!confirm('一鍵排班將自動排班。已手動填入的上班和假別都會保留。')) return;
  pushHistory('一鍵排班', null);
  const days  = daysInMonth(state.year, state.month);
  const quota = getQuota();
  const solverInput = buildScheduleFromState(days);

  // 先驗證手動畫格本身是否有重大衝突
  const preCheck = validateSchedule({ ...solverInput, days, quota });
  const preManual = preCheck.hardViolations.filter(v => v.type === 'MANUAL_OVERWRITE');
  if (preManual.length > 0) {
    console.table(preManual);
    showToast('手動畫格有 ' + preManual.length + ' 個衝突，請先修正再排班');
    return;
  }

  // 執行 greedyFill
  const result = greedyFill({ ...solverInput, days, quota });
  const criticalLocks = result.criticalLocks || new Set();

  // Phase 3b：休假不足修補
  result.schedule = repairQuotaByReplacingWorkDays(
    { ...solverInput, days, quota },
    result.schedule
  );

  // Phase 3a：針對 SHIFT_NOT_COVERED 局部修復
  const repairedSchedule = targetedRepairMissingShifts(
    { ...solverInput, days, quota },
    result.schedule
  );
  result.schedule = repairedSchedule;

  // Phase 6：優化人力配置（Phase 3a 修完缺班後再優化）
  result.schedule = optimizeOverstaffingAndSupervisor(
    { ...solverInput, days, quota },
    result.schedule
  );

  // Phase 3a 第二次：Phase 6 可能清空某人的班，重新補缺班
  result.schedule = targetedRepairMissingShifts(
    { ...solverInput, days, quota },
    result.schedule
  );

  // Phase 3c：修補正職自動連休超過 2 天
  result.schedule = repairAutoRestOver2(
    { ...solverInput, days, quota },
    result.schedule
  );

  // 驗證結果
  const postCheck = validateSchedule({ schedule: result.schedule, manualLocks: result.manualLocks, days, quota });
  if (postCheck.hardViolations.length > 0) {
    console.table(postCheck.hardViolations);
    showToast('排班未完成，有 ' + postCheck.hardViolations.length + ' 個硬性衝突，請查看 console');
    // 仍然寫入，讓使用者看到目前狀態（可手動修正）
  }

  // 寫入 state.cells（跳過 manualLocks）
  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      if (result.manualLocks.has(key)) continue;
      const v = result.schedule[s.id] ? (result.schedule[s.id][d] || '') : '';
      if (v === '') delete state.cells[key];
      else state.cells[key] = v;
    }
  });

  state.unsaved = true;
  setSaveStatus('有未儲存的變更');
  renderTable();
  renderStats();
  renderWarnings();

  if (postCheck.hardViolations.length === 0) {
    showToast('一鍵排班完成！');
  } else {
    showToast('排班完成，但有 ' + postCheck.hardViolations.length + ' 個衝突，詳見 console');
  }
  return; // 新版結束，不執行下方舊版
}

function autoScheduleLegacy() {
  if (!confirm('一鍵排班將自動排班。已手動填入的上班和假別都會保留。')) return;
  pushHistory('一鍵排班', null);

  const days = daysInMonth(state.year, state.month);
  const quota = getQuota();
  const totalOff = quota.li + quota.xi + quota.guo;

  const seika = state.staff.filter(s => s.type === '正職');
  const ptAll = state.staff.filter(s => s.type === 'PT');
  const manager = state.staff.find(s => s.type === '主管');
  const allStaff = state.staff;

  // 彈性正職：canShifts >= 2 的正職
  const flexSeika = seika.filter(s => s.canShifts.length >= 2);

  // ===== Step 0: 清除非手動格子（只清正職） =====

  seika.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      if (!state.edited.has(key)) {
        delete state.cells[key];
      }
    }
  });


  // ===== Step 1: 計算每天正職人力需求 =====
  // 計算每天 PT+主管 能覆蓋幾個班別
  const dayCoverage = {}; // day -> Set of covered shifts
  const dayFlexCanRest = {}; // day -> 彈性正職最多幾人可休
  for (let d = 1; d <= days; d++) {
    const covered = new Set();
    // PT 手動填的班
    ptAll.forEach(s => {
      const v = state.cells[cellKey(s.id, d)] || '';
      const sh = whichShift(v);
      if (sh) covered.add(sh);
    });
    // 主管手動填的班
    if (manager) {
      const v = state.cells[cellKey(manager.id, d)] || '';
      const sh = whichShift(v);
      if (sh) covered.add(sh);
    }
    dayCoverage[d] = covered;
    // 缺幾個班需要正職補
    const needed = ['AE','AT','EA'].filter(sh => !covered.has(sh)).length;
    // 彈性正職中最多幾人可休
    const flexCount = flexSeika.length;
    const maxFlexRest = Math.max(0, flexCount - needed);
    dayFlexCanRest[d] = maxFlexRest;
  }

  // ===== Step 2: 為每位正職分配休假日 =====
  seika.forEach((s, seikaIdx) => {
    const mainShift = s.canShifts.length === 1 ? s.canShifts[0]
      : s.name.includes('辰倩') ? 'AT'
      : s.name.includes('苡禎') ? 'EA' : 'AE';
    s._mainShift = mainShift;
    s._isFlex = s.canShifts.length >= 2;

    // blockedDays：所有手動畫格子（絕對不能動）
    const blockedDays = new Set();
    // manualOfficialOffDays：手動畫的 OFF（例/休/國），計入 quota
    const manualOfficialOffDays = [];
    // manualLeaveDays：手動畫的 SICK（事/年/病），不計入 quota
    const manualLeaveDays = [];

    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      if (state.edited.has(key)) {
        blockedDays.add(d);
        const v = state.cells[key] || '';
        if (OFF.includes(v)) manualOfficialOffDays.push(d);
        else if (SICK.includes(v)) manualLeaveDays.push(d);
      }
    }

    const quota = getQuota();
    const autoOffNeeded = Math.max(0, (quota.li + quota.xi + quota.guo) - manualOfficialOffDays.length);

    // officialOffSet：從手動 OFF 開始，演算法補到 quota.total
    const officialOffSet = new Set(manualOfficialOffDays);

    // nonWorkSet：officialOffSet + manualLeaveDays，用來判斷連續上班
    function getNonWorkSet() {
      const s2 = new Set(officialOffSet);
      manualLeaveDays.forEach(d => s2.add(d));
      return s2;
    }

    // 判斷某天能不能加官方休假
    function canAddOff(d) {
      if (blockedDays.has(d)) return false;
      const nonWork = getNonWorkSet();
      if (nonWork.has(d)) return false;

      // 彈性正職同日休限制
      if (s._isFlex) {
        const otherFlexRestCount = flexSeika.filter(other => {
          if (other === s) return false;
          const ov = state.cells[cellKey(other.id, d)] || '';
          const isEditedOff = state.edited.has(cellKey(other.id, d)) && (OFF.includes(ov) || SICK.includes(ov));
          return isEditedOff || (other._officialOffSet && other._officialOffSet.has(d));
        }).length;
        if (otherFlexRestCount >= dayFlexCanRest[d]) return false;
      }

      // 自動連休 ≤ 2（不含手動 OFF 和 SICK）
      let autoBefore = 0, autoAfter = 0;
      for (let dd = d - 1; dd >= 1; dd--) {
        if (!officialOffSet.has(dd) && !manualLeaveDays.includes(dd)) break;
        if (!manualOfficialOffDays.includes(dd) && !manualLeaveDays.includes(dd)) autoBefore++;
        else break;
      }
      for (let dd = d + 1; dd <= days; dd++) {
        if (!officialOffSet.has(dd) && !manualLeaveDays.includes(dd)) break;
        if (!manualOfficialOffDays.includes(dd) && !manualLeaveDays.includes(dd)) autoAfter++;
        else break;
      }
      if (autoBefore + autoAfter >= 2) return false;

      // 每日 AE / AT / EA 覆蓋檢查
      if (wouldBreakDailyShiftCoverage(s, d, days)) return false;

      return true;
    }

    // 均勻間距插入官方休假
    const step = days / (quota.li + quota.xi + quota.guo);
    const offset = seikaIdx * (step / seika.length);

    const targetOffTotal = manualOfficialOffDays.length + autoOffNeeded;
    for (let i = 0; officialOffSet.size < targetOffTotal; i++) {
      if (i > days * 2) break; // 安全跳出
      const ideal = Math.round(offset + (i + 0.5) * step);
      // 按距離理想日期由近到遠排序候選日
      const candidates = Array.from({length: days}, (_, idx) => idx + 1)
        .filter(d => !blockedDays.has(d) && !officialOffSet.has(d) && !manualLeaveDays.includes(d))
        .sort((a, b) => Math.abs(a - ideal) - Math.abs(b - ideal));
      let found = false;
      for (const d of candidates) {
        if (canAddOff(d)) {
          officialOffSet.add(d);
          found = true;
          break;
        }
      }
      if (!found) {
        // 找不到合法日期，記錄 violation，不硬塞
        console.warn('[Step2] ' + s.name + ' 無法補足官方休假，目前 ' + officialOffSet.size + '/' + targetOffTotal);
        break;
      }
    }

    // 確保不連6（用 nonWorkSet 判斷）
    let fix6 = 0;
    while (fix6++ < 200) {
      const nonWork = getNonWorkSet();
      let streak = 0, streakStart = 1, violated = -1;
      for (let d = 1; d <= days; d++) {
        if (!nonWork.has(d)) {
          if (!streak) streakStart = d;
          streak++;
          if (streak >= 6) { violated = streakStart + 4; break; }
        } else streak = 0;
      }
      if (violated === -1) break;
      if (!blockedDays.has(violated) && !officialOffSet.has(violated)) {
        officialOffSet.add(violated);
        // 移除一個自動休保持總數
        const target = manualOfficialOffDays.length + autoOffNeeded;
        if (officialOffSet.size > target) {
          const rem = [...officialOffSet]
            .filter(d => !manualOfficialOffDays.includes(d) && d !== violated);
          if (rem.length) officialOffSet.delete(rem[0]);
        }
      }
    }

    // 確保剛好 autoOffNeeded 天（自動部分）
    const targetTotal = manualOfficialOffDays.length + autoOffNeeded;
    while (officialOffSet.size > targetTotal) {
      const rem = [...officialOffSet].filter(d => !manualOfficialOffDays.includes(d));
      if (!rem.length) break;
      officialOffSet.delete(rem[0]);
    }

    s._officialOffSet = officialOffSet;
    s._offSet = officialOffSet;
    s._blockedDays = blockedDays;
    s._manualLeaveDays = new Set(manualLeaveDays);
  });

  // ===== Step 2.5: 修正三人同日全休 =====
  for (let d = 1; d <= days; d++) {
    const flexAllOff = flexSeika.filter(s => s._officialOffSet.has(d) && !state.edited.has(cellKey(s.id, d)));
    if (flexAllOff.length < 2) continue;
    const target = flexAllOff[0];
    // 按距離 d 由近到遠搜尋可移動日
    const moveCandidates = Array.from({length: days}, (_, idx) => idx + 1)
      .filter(nd => nd !== d && !target._officialOffSet.has(nd) && !target._blockedDays.has(nd)
                 && !target._manualLeaveDays.has(nd))
      .sort((a, b) => Math.abs(a - d) - Math.abs(b - d));
    for (const nd of moveCandidates) {
      target._officialOffSet.delete(d);
      target._officialOffSet.add(nd);
      // 檢查不連6
      let ok = true, streak = 0;
      for (let dd = 1; dd <= days; dd++) {
        const inNonWork = target._officialOffSet.has(dd) || target._manualLeaveDays.has(dd);
        if (!inNonWork) { streak++; if (streak >= 6) { ok = false; break; } }
        else streak = 0;
      }
      // 檢查移入日不破壞每日覆蓋（用可補判斷，不用硬性禁止）
      if (ok && wouldBreakDailyShiftCoverage(target, nd, days)) ok = false;
      // 檢查原休假日移走後，target 當天要改上班，不能違反 11h 或連上 6
      if (ok) {
        const shiftBack = target._mainShift || '';
        if (shiftBack) {
          if (!checkAdjacent(getPredictedShift(target, d-1, days), shiftBack)) ok = false;
          if (!checkAdjacent(shiftBack, getPredictedShift(target, d+1, days))) ok = false;
          if (wouldExceedMaxConsecutiveWork(target.id, d, shiftBack, days)) ok = false;
        }
      }
      if (!ok) { target._officialOffSet.delete(nd); target._officialOffSet.add(d); continue; }
      break;
    }
  }

  // ===== Step 3: 寫入正職班表 =====
  seika.forEach(s => {
    if (!(s._offSet instanceof Set)) s._offSet = new Set();
    if (!(s._manualLeaveDays instanceof Set)) s._manualLeaveDays = new Set();
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      if (state.edited.has(key)) continue;
      if (s._offSet.has(d)) {
        // 官方休假日：寫「休」作為 placeholder，分配例/休/國 由 distribute-btn 處理
        state.cells[key] = '休';
      } else if (!s._manualLeaveDays.has(d)) {
        // 非休假、非請假：排上班
        if (canAutoSetCell(s, d, s._mainShift, days)) {
          state.cells[key] = s._mainShift;
        }
      }
    }
  });

  // ===== Step 4: 修正 11h 違規 =====
  for (let d = 1; d < days; d++) {
    seika.forEach(s => {
      const v1 = state.cells[cellKey(s.id, d)] || '';
      const v2 = state.cells[cellKey(s.id, d+1)] || '';
      if (!isWork(v1) || !isWork(v2)) return;
      if (checkAdjacent(v1, v2)) return;
      if (state.edited.has(cellKey(s.id, d)) && state.edited.has(cellKey(s.id, d+1))) return;

      // 方法1: 跟另一彈性正職交換隔日班別
      for (const other of seika) {
        if (other === s || other.canShifts.length < 2) continue;
        const ov2 = state.cells[cellKey(other.id, d+1)] || '';
        if (!isWork(ov2)) continue;
        if (state.edited.has(cellKey(other.id, d+1))) continue;
        const newS = ov2, newOther = v2;
        if (!s.canShifts.includes(newS) || !other.canShifts.includes(newOther)) continue;
        const v3S = d+2 <= days ? (state.cells[cellKey(s.id, d+2)] || '') : '';
        const v1O = state.cells[cellKey(other.id, d)] || '';
        const v3O = d+2 <= days ? (state.cells[cellKey(other.id, d+2)] || '') : '';
        if (checkAdjacent(v1, newS) && checkAdjacent(newS, v3S) &&
            checkAdjacent(v1O, newOther) && checkAdjacent(newOther, v3O)) {
          state.cells[cellKey(s.id, d+1)] = newS;
          state.cells[cellKey(other.id, d+1)] = newOther;
          return;
        }
      }

      // 方法2: 跟彈性正職交換休假日
      for (const other of seika) {
        if (other === s || other.canShifts.length < 2) continue;
        const ov2 = state.cells[cellKey(other.id, d+1)] || '';
        if (ov2 !== '休' || state.edited.has(cellKey(other.id, d+1))) continue;
        if (!other.canShifts.includes(v2)) continue;
        const v1O = state.cells[cellKey(other.id, d)] || '';
        const v3O = d+2 <= days ? (state.cells[cellKey(other.id, d+2)] || '') : '';
        if (!checkAdjacent(v1O, v2) || !checkAdjacent(v2, v3O)) continue;
        // 找 swapDay: s 是休且非手動，other 是上班且非手動
        for (let nd = 1; nd <= days; nd++) {
          if (nd === d+1) continue;
          const sv = state.cells[cellKey(s.id, nd)] || '';
          const ov = state.cells[cellKey(other.id, nd)] || '';
          if (sv !== '休' || state.edited.has(cellKey(s.id, nd))) continue;
          if (!isWork(ov) || state.edited.has(cellKey(other.id, nd))) continue;
          if (!s.canShifts.includes(ov)) continue;
          const p1 = nd > 1 ? (state.cells[cellKey(s.id, nd-1)] || '') : '';
          const p2 = nd < days ? (state.cells[cellKey(s.id, nd+1)] || '') : '';
          if (!checkAdjacent(p1, ov) || !checkAdjacent(ov, p2)) continue;
          state.cells[cellKey(s.id, d+1)] = '休';
          state.cells[cellKey(other.id, d+1)] = v2;
          state.cells[cellKey(s.id, nd)] = ov;
          state.cells[cellKey(other.id, nd)] = '休';
          return;
        }
      }

      // 方法3: 移動休假（不能新增休，只能搬移自動休）
      (function tryMoveOff() {
        const violDay = d + 1;
        if (state.edited.has(cellKey(s.id, violDay))) return;
        // 搜尋可交換的自動休：±7 → ±14 → 全月
        const ranges = [7, 14, days];
        for (const radius of ranges) {
          for (let nd = 1; nd <= days; nd++) {
            if (Math.abs(nd - violDay) > radius) continue;
            if (nd === violDay) continue;
            const nk = cellKey(s.id, nd);
            if (state.edited.has(nk)) continue;
            const nv = state.cells[nk] || '';
            if (!OFF.includes(nv)) continue; // 只搬自動休
            // 搬走後 nd 要能上班
            const shiftForNd = s._mainShift;
            if (!s.canShifts.includes(shiftForNd)) continue;
            // 暫時模擬：把 violDay 設休，nd 設上班
            const origViol = state.cells[cellKey(s.id, violDay)] || '';
            const origNd = nv;
            state.cells[cellKey(s.id, violDay)] = '休';
            state.cells[nk] = shiftForNd;
            // 檢查合法性
            const ok11viol = checkElevenHours(s.id, violDay, '休', days);
            const ok11nd = checkElevenHours(s.id, nd, shiftForNd, days);
            const okStreakViol = !wouldExceedMaxConsecutiveWork(s.id, nd, shiftForNd, days);
            const okRestViol = !wouldCreateAutoRestOver2(s.id, violDay, '休', days);
            if (ok11viol && ok11nd && okStreakViol && okRestViol) {
              // 合法，保留交換
              return;
            }
            // 不合法，還原
            state.cells[cellKey(s.id, violDay)] = origViol;
            state.cells[nk] = origNd;
          }
        }
        console.warn('[Step4] ' + s.name + ' 第' + violDay + '天 11h違規無法移動休假修正');
      })();
    });
  }

  // ===== Step 5: 補缺班 =====
  // 輔助：檢查某人某天可不可以補班
  function canWork(staffId, d, shift, _maxStreak) {
    const v = state.cells[cellKey(staffId, d)] || '';
    if (isWork(v) || OFF.includes(v) || SICK.includes(v)) return false;
    if (!checkElevenHours(staffId, d, shift, days)) return false;
    if (wouldExceedMaxConsecutiveWork(staffId, d, shift, days)) return false;
    return true;
  }

  function monthWorkCount(staffId) {
    let cnt = 0;
    for (let d = 1; d <= days; d++) {
      if (isWork(state.cells[cellKey(staffId, d)] || '')) cnt++;
    }
    return cnt;
  }

  for (let d = 1; d <= days; d++) {
    const cov = new Set();
    state.staff.forEach(s => {
      const sh = whichShift(state.cells[cellKey(s.id, d)] || '');
      if (sh) cov.add(sh);
    });

    ['AE','AT','EA'].forEach(shift => {
      if (cov.has(shift)) return;

      // 1) 彈性正職換班
      for (const s of seika) {
        if (cov.has(shift)) break;
        if (s.canShifts.length < 2 || !s.canShifts.includes(shift)) continue;
        if (state.edited.has(cellKey(s.id, d))) continue;
        const v = state.cells[cellKey(s.id, d)] || '';
        if (!isWork(v) || v === shift) continue;
        const others = state.staff.filter(x => x.id !== s.id);
        if (!others.some(x => whichShift(state.cells[cellKey(x.id, d)] || '') === v)) continue;
        if (!checkElevenHours(s.id, d, shift, days)) continue;
        state.cells[cellKey(s.id, d)] = shift;
        cov.add(shift);
      }
      if (cov.has(shift)) return;

      // 2) PT 補（宏儒優先，月≤15天、不連5）
      const ptSorted = [...ptAll].sort((a, b) => {
        const aIsHongRu = a.name.includes('宏儒') ? 0 : 1;
        const bIsHongRu = b.name.includes('宏儒') ? 0 : 1;
        return aIsHongRu - bIsHongRu;
      });
      for (const s of ptSorted) {
        if (cov.has(shift)) break;
        if (!s.canShifts.includes(shift)) continue;
        if (!canAutoSetCell(s, d, shift, days)) continue;
        if (monthWorkCount(s.id) >= 15) continue;
        if (!canWork(s.id, d, shift, 5)) continue;
        state.cells[cellKey(s.id, d)] = shift;
        cov.add(shift);
      }
      if (cov.has(shift)) return;

      // 3) 鎮安補（不連5）
      if (manager && !state.edited.has(cellKey(manager.id, d))) {
        if (manager.canShifts.includes(shift)
            && canWork(manager.id, d, shift, 5)
            && canAutoSetCell(manager, d, shift, days)) {
          state.cells[cellKey(manager.id, d)] = shift;
          cov.add(shift);
        }
      }
    });
  }

  // ===== Step 6: 清理暫時屬性 =====
  seika.forEach(s => {
    delete s._officialOffSet;
    delete s._offSet;
    delete s._blockedDays;
    delete s._manualLeaveDays;
    delete s._mainShift;
    delete s._isFlex;
  });

  const filledCount = Object.keys(state.cells).length;
  state.unsaved = true;
  setSaveStatus('有未儲存的變更');
  renderTable();
  renderStats();
  renderWarnings();
  finalValidateSchedule(days);
  if (state.changeLog.length > 0) {
    state.changeLog[0] = state.changeLog[0].replace('一鍵排班', `一鍵排班 ${filledCount}筆`);
    document.getElementById('change-log').textContent = state.changeLog.join('　|　');
  }
}

// ===== SOLVER PHASE 1: 驗證器 =====

function validateSchedule({ schedule, manualLocks, days, quota }) {
  const hardViolations = [];
  const softViolations = [];
  const stats = {};

  // 初始化 stats
  state.staff.forEach(s => {
    stats[s.id] = { name: s.name, workDays: 0, officialOff: 0, li: 0, xi: 0, guo: 0, sick: 0, blank: 0 };
  });
  const dailyCoverage = {};
  for (let d = 1; d <= days; d++) dailyCoverage[d] = { AE: [], AT: [], EA: [] };

  // 統計 & 每日覆蓋（用 getCoveredSlot 統一判斷）
  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const v = (schedule[s.id] && schedule[s.id][d]) || '';
      const st = stats[s.id];
      if (!v) { st.blank++; continue; }
      const slot = getLooseCoveredSlot(v);
      if (slot) { st.workDays++; dailyCoverage[d][slot].push(s.name); }
      else if (isWork(v)) { st.workDays++; } // 自訂時段但不覆蓋固定班別
      else if (v === '例') { st.li++; st.officialOff++; }
      else if (v === '休') { st.xi++; st.officialOff++; }
      else if (v === '國') { st.guo++; st.officialOff++; }
      else if (SICK.includes(v)) { st.sick++; }
    }
  });
  stats.dailyCoverage = dailyCoverage;

  const quotaTotal = quota.li + quota.xi + quota.guo;

  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      const current = (schedule[s.id] && schedule[s.id][d]) || '';

      // Hard 1: 手動格被覆蓋
      if (manualLocks.has(key)) {
        const original = manualLocks.get(key);
        if (current !== original) {
          hardViolations.push({
            type: 'MANUAL_OVERWRITE', staffId: s.id, staffName: s.name, day: d,
            source: 'auto',
            detail: '手動畫格被覆蓋：原本「' + original + '」現在「' + current + '」',
            severity: 'hard'
          });
        }
      }

      // Hard 7: canShifts 以外的班
      const sh = whichShift(current);
      if (sh && s.canShifts && !s.canShifts.includes(sh)) {
        hardViolations.push({
          type: 'INVALID_SHIFT', staffId: s.id, staffName: s.name, day: d,
          detail: s.name + ' 被排到不可上的班別 ' + current,
          severity: 'hard'
        });
      }
    }

    // Hard 3: 連續上班 > 5
    let streak = 0, streakStart = 1;
    for (let d = 1; d <= days; d++) {
      const v = (schedule[s.id] && schedule[s.id][d]) || '';
      if (isWork(v)) {
        if (streak === 0) streakStart = d;
        streak++;
        if (streak > 5) {
          hardViolations.push({
            type: 'CONSECUTIVE_OVER5', staffId: s.id, staffName: s.name, day: d,
            detail: s.name + ' 連續上班第' + streak + '天（' + streakStart + '～' + d + '日）',
            severity: 'hard'
          });
        }
      } else if (!SICK.includes(v)) {
        streak = 0;
      }
    }

    // Hard 4: 11h 違規（用絕對時間 hasElevenHourRestByDay + isForbiddenShiftPair）
    for (let d = 1; d < days; d++) {
      const v1 = (schedule[s.id] && schedule[s.id][d]) || '';
      const v2 = (schedule[s.id] && schedule[s.id][d + 1]) || '';
      if (!isWork(v1) || !isWork(v2)) continue;
      const restOk    = hasElevenHourRestByDay(s, v1, d, v2, d + 1);
      const notForbid = !isForbiddenShiftPair(v1, v2);
      if (!restOk || !notForbid) {
        const k1 = cellKey(s.id, d), k2 = cellKey(s.id, d + 1);
        const m1 = manualLocks.has(k1), m2 = manualLocks.has(k2);
        const src = (m1 && m2) ? 'manual' : (!m1 && !m2) ? 'auto' : 'mixed';
        const srcNote = src === 'manual'
          ? '（此違規來自手動畫格，autoSchedule 不會修改，請手動修正）' : '';
        hardViolations.push({
          type: 'ELEVEN_HOUR_VIOLATION', staffId: s.id, staffName: s.name, day: d,
          source: src,
          detail: s.name + ' ' + d + '日' + v1 + '→' + (d+1) + '日' + v2
                  + (restOk ? '' : ' 休息不足11h')
                  + (!notForbid ? ' 禁止班別組合' : '')
                  + srcNote,
          severity: 'hard'
        });
      }
    }

    // Hard 5: 正職官方休假總數
    if (s.type === '正職') {
      const st = stats[s.id];
      if (st.officialOff !== quotaTotal) {
        hardViolations.push({
          type: 'QUOTA_MISMATCH', staffId: s.id, staffName: s.name, day: null,
          detail: s.name + ' 官方休假 ' + st.officialOff + ' 天，應為 ' + quotaTotal + ' 天',
          severity: 'hard'
        });
      }
    }

    // Hard 6: PT 月上班 > 15
    if (s.type === 'PT') {
      if (stats[s.id].workDays > 15) {
        hardViolations.push({
          type: 'PT_OVERLIMIT', staffId: s.id, staffName: s.name, day: null,
          detail: s.name + ' 本月上班 ' + stats[s.id].workDays + ' 天，超過15天上限',
          severity: 'hard'
        });
      }
    }

    // 自動連休 > 2（正職為 hard，其他為 soft）
    let offStreak = 0, offStart = 1;
    for (let d = 1; d <= days; d++) {
      const key = cellKey(s.id, d);
      const v = (schedule[s.id] && schedule[s.id][d]) || '';
      const isAutoOff = OFF.includes(v) && !manualLocks.has(key);
      if (isAutoOff) {
        if (offStreak === 0) offStart = d;
        offStreak++;
        if (offStreak > 2) {
          if (s.type === '正職') {
            hardViolations.push({
              type: 'AUTO_REST_OVER2', staffId: s.id, staffName: s.name, day: d,
              source: 'auto',
              detail: s.name + ' 自動連休第' + offStreak + '天（' + offStart + '～' + d + '日）',
              severity: 'hard'
            });
          } else {
            softViolations.push({
              type: 'AUTO_REST_OVER2', staffId: s.id, staffName: s.name, day: d,
              detail: s.name + ' 自動連休第' + offStreak + '天（' + offStart + '～' + d + '日）',
              severity: 'soft'
            });
          }
        }
      } else { offStreak = 0; }
    }

    // Soft 3: 主管補班過多（超過 10 天視為過多）
    if (s.type === '主管' && stats[s.id].workDays > 10) {
      softViolations.push({
        type: 'MANAGER_OVERWORK', staffId: s.id, staffName: s.name, day: null,
        detail: s.name + ' 本月上班 ' + stats[s.id].workDays + ' 天',
        severity: 'soft'
      });
    }
  });

  // Hard 2: 每日 AE / AT / EA 各至少 1 人
  for (let d = 1; d <= days; d++) {
    ['AE', 'AT', 'EA'].forEach(sh => {
      if (dailyCoverage[d][sh].length === 0) {
        hardViolations.push({
          type: 'SHIFT_NOT_COVERED', staffId: null, staffName: null, day: d,
          source: 'auto',
          detail: d + '日 ' + sh + ' 班無人覆蓋',
          severity: 'hard'
        });
      }
    });
  }

  return { hardViolations, softViolations, stats };
}

// ===== SOLVER PHASE 2: GREEDY FILL =====

// ===== SOLVER PHASE 2 新版：先補班，再排休 =====

// 每班補缺候選順位（ptMode=fixed 不進入）
const SLOT_FILL_PRIORITY = {
  AE: ['K250601', 'K250603', 'P260201', 'K230101'],
  AT: ['K250603', 'K250601', 'P260201', 'K230101'],
  EA: ['K250901', 'P260201', 'K230101'],
};

// 動態產生候選順位（純員工資料，不判斷當天狀況）
// 排序：正職 → flex PT → 主管，同類型內依 priorityBySlot[slot] 由小到大
// fixed PT 排除；沒有 priorityBySlot 的排到同類型最後
function getCandidatesForSlot(slot) {
  const typeOrder = { '正職': 0, 'PT': 1, '主管': 2 };
  return state.staff
    .filter(s => {
      if (!s.canShifts || !s.canShifts.includes(slot)) return false;
      const cfg = getSlotConfigForStaff(s);
      if (cfg.ptMode === 'fixed') return false;
      return true;
    })
    .sort((a, b) => {
      const tA = typeOrder[a.type] ?? 99;
      const tB = typeOrder[b.type] ?? 99;
      if (tA !== tB) return tA - tB;
      const pA = (a.priorityBySlot && a.priorityBySlot[slot] != null) ? a.priorityBySlot[slot] : 999;
      const pB = (b.priorityBySlot && b.priorityBySlot[slot] != null) ? b.priorityBySlot[slot] : 999;
      return pA - pB;
    })
    .map(s => s.id);
}

function greedyFill(solverInput) {
  const { schedule, manualLocks, days, quota } = solverInput;
  const violations = [];

  // 深拷貝
  const sch = {};
  state.staff.forEach(s => {
    sch[s.id] = {};
    for (let d = 1; d <= days; d++) {
      sch[s.id][d] = (schedule[s.id] && schedule[s.id][d]) || '';
    }
  });

  const quotaTotal = quota.li + quota.xi + quota.guo;

  function get(staffId, d) { return (sch[staffId] && sch[staffId][d]) || ''; }
  function set(staffId, d, v) { if (sch[staffId]) sch[staffId][d] = v; }
  function locked(staffId, d) { return manualLocks.has(cellKey(staffId, d)); }

  function workCount(staffId) {
    let c = 0;
    for (let d = 1; d <= days; d++) if (isWork(get(staffId, d))) c++;
    return c;
  }

  function consecBefore(staffId, d) {
    let c = 0;
    for (let dd = d-1; dd >= 1; dd--) {
      if (isWork(get(staffId, dd))) c++; else break;
    }
    return c;
  }
  function consecAfter(staffId, d) {
    let c = 0;
    for (let dd = d+1; dd <= days; dd++) {
      if (isWork(get(staffId, dd))) c++; else break;
    }
    return c;
  }

  // 11h + forbidden pair 檢查（用 getAssignmentTime）
  function slotLegal(staff, d, slot) {
    const prev = d > 1    ? get(staff.id, d-1) : '';
    const next = d < days ? get(staff.id, d+1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRestByDay(staff, prev, d-1, slot, d)) return false;
      if (isForbiddenShiftPair(prev, slot)) return false;
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRestByDay(staff, slot, d, next, d+1)) return false;
      if (isForbiddenShiftPair(slot, next)) return false;
    }
    return true;
  }

  // 關鍵日保護：flex PT 排 EA 前，檢查隔天 AE/AT 是否會被卡死
  function wouldBlockNextDayCriticalCoverage(staff, day, slot, schSnap) {
    // 只針對 flex PT + EA
    const cfg = getSlotConfigForStaff(staff);
    if (!(staff.type === 'PT' && cfg.ptMode === 'flex' && slot === 'EA')) return false;
    const nextDay = day + 1;
    if (nextDay > days) return false;

    // 模擬今天排 EA 後，看隔天 AE/AT 是否各有人
    for (const nextSlot of ['AE', 'AT']) {
      // 隔天已有人確定覆蓋這個 slot → 不用管
      const alreadyCovered = state.staff.some(s => {
        if (s.id === staff.id) return false;
        const v = (schSnap[s.id] && schSnap[s.id][nextDay]) || '';
        return getLooseCoveredSlot(v) === nextSlot;
      });
      if (alreadyCovered) continue;

      // 隔天這個 slot 沒有確定覆蓋，找除了 staff 之外還有沒有合法候選人
      const candidates = getCandidatesForSlot(nextSlot).filter(sid => {
        if (sid === staff.id) return false;
        const s = state.staff.find(x => x.id === sid);
        if (!s) return false;
        const scfg = getSlotConfigForStaff(s);
        if (scfg.ptMode === 'fixed') return false;
        if (locked(sid, nextDay)) return false;
        const v = (schSnap[s.id] && schSnap[s.id][nextDay]) || '';
        if (OFF.includes(v) || SICK.includes(v)) return false;
        if (s.type === 'PT') {
          let wc = 0;
          for (let d = 1; d <= days; d++) if (isWork((schSnap[s.id] && schSnap[s.id][d]) || '')) wc++;
          if (wc >= 15) return false;
        }
        // 檢查 nextDay 前一天（也就是今天，staff 排 EA）對候選人的影響
        const prevV = (schSnap[s.id] && schSnap[s.id][day]) || '';
        if (prevV && isWork(prevV)) {
          if (!hasElevenHourRestByDay(s, prevV, day, nextSlot, nextDay)) return false;
          if (isForbiddenShiftPair(prevV, nextSlot)) return false;
        }
        const nextNextV = nextDay < days ? ((schSnap[s.id] && schSnap[s.id][nextDay + 1]) || '') : '';
        if (nextNextV && isWork(nextNextV)) {
          if (!hasElevenHourRestByDay(s, nextSlot, nextDay, nextNextV, nextDay + 1)) return false;
          if (isForbiddenShiftPair(nextSlot, nextNextV)) return false;
        }
        return true;
      });

      // 沒有其他人可以補隔天這個 slot → 這個 staff 是關鍵人力，今天不能排 EA
      if (candidates.length === 0) return true;
    }
    return false;
  }

  // 關鍵日保護：flex PT 排 EA 前，檢查隔天 AE/AT 是否會被卡死
  function wouldBlockNextDayCriticalCoverage(staff, day, slot, schSnap) {
    // 只針對 flex PT + EA
    const cfg = getSlotConfigForStaff(staff);
    if (!(staff.type === 'PT' && cfg.ptMode === 'flex' && slot === 'EA')) return false;
    const nextDay = day + 1;
    if (nextDay > days) return false;

    // 模擬今天排 EA 後，看隔天 AE/AT 是否各有人
    for (const nextSlot of ['AE', 'AT']) {
      // 隔天已有人確定覆蓋這個 slot → 不用管
      const alreadyCovered = state.staff.some(s => {
        if (s.id === staff.id) return false;
        const v = (schSnap[s.id] && schSnap[s.id][nextDay]) || '';
        return getLooseCoveredSlot(v) === nextSlot;
      });
      if (alreadyCovered) continue;

      // 隔天這個 slot 沒有確定覆蓋，找除了 staff 之外還有沒有合法候選人
      const candidates = getCandidatesForSlot(nextSlot).filter(sid => {
        if (sid === staff.id) return false;
        const s = state.staff.find(x => x.id === sid);
        if (!s) return false;
        const scfg = getSlotConfigForStaff(s);
        if (scfg.ptMode === 'fixed') return false;
        if (locked(sid, nextDay)) return false;
        const v = (schSnap[s.id] && schSnap[s.id][nextDay]) || '';
        if (OFF.includes(v) || SICK.includes(v)) return false;
        if (s.type === 'PT') {
          let wc = 0;
          for (let d = 1; d <= days; d++) if (isWork((schSnap[s.id] && schSnap[s.id][d]) || '')) wc++;
          if (wc >= 15) return false;
        }
        // 檢查 nextDay 前一天（也就是今天，staff 排 EA）對候選人的影響
        const prevV = (schSnap[s.id] && schSnap[s.id][day]) || '';
        if (prevV && isWork(prevV)) {
          if (!hasElevenHourRestByDay(s, prevV, day, nextSlot, nextDay)) return false;
          if (isForbiddenShiftPair(prevV, nextSlot)) return false;
        }
        const nextNextV = nextDay < days ? ((schSnap[s.id] && schSnap[s.id][nextDay + 1]) || '') : '';
        if (nextNextV && isWork(nextNextV)) {
          if (!hasElevenHourRestByDay(s, nextSlot, nextDay, nextNextV, nextDay + 1)) return false;
          if (isForbiddenShiftPair(nextSlot, nextNextV)) return false;
        }
        return true;
      });

      // 沒有其他人可以補隔天這個 slot → 這個 staff 是關鍵人力，今天不能排 EA
      if (candidates.length === 0) return true;
    }
    return false;
  }

  // 取得當天 slot 覆蓋
  function getDayCoverage(d) {
    const cov = { AE: [], AT: [], EA: [] };
    state.staff.forEach(s => {
      const v = get(s.id, d);
      const slot = getLooseCoveredSlot(v);
      if (slot) cov[slot].push(s.id);
    });
    return cov;
  }

  // 自動連休計數（空白不算）
  function autoRestStreak(staffId, d) {
    let before = 0, after = 0;
    for (let dd = d-1; dd >= 1; dd--) {
      const v = get(staffId, dd);
      if (!v) break;
      if ((OFF.includes(v)||SICK.includes(v)) && !locked(staffId, dd)) before++;
      else break;
    }
    for (let dd = d+1; dd <= days; dd++) {
      const v = get(staffId, dd);
      if (!v) break;
      if ((OFF.includes(v)||SICK.includes(v)) && !locked(staffId, dd)) after++;
      else break;
    }
    return before + 1 + after;
  }

  // 排休後當天 slot 是否仍有人
  function slotStillCoveredIfRest(staffId, d, slot) {
    return state.staff.some(s => {
      if (s.id === staffId) return false;
      return getLooseCoveredSlot(get(s.id, d)) === slot;
    });
  }

  // ===== Phase 0: critical day 預排 =====
  // 先找出人力緊張的日子，預先排班，避免前一天把關鍵人力用掉
  const criticalLocks = new Set(); // Phase 0 預排的格子，不放進 manualLocks

  function isCriticalDay(d) {
    // 計算當天可用人力（排除 fixed PT、manualLocked 休假/請假）
    const available = state.staff.filter(s => {
      const cfg = getSlotConfigForStaff(s);
      if (cfg.ptMode === 'fixed') return false;
      const key = cellKey(s.id, d);
      if (locked(s.id, d)) {
        const v = get(s.id, d);
        if (OFF.includes(v) || SICK.includes(v)) return false;
      }
      const v = get(s.id, d);
      if (OFF.includes(v) || SICK.includes(v)) return false;
      return true;
    });
    return available.length <= 3;
  }

  // 找出所有 critical day，依可用人力由少到多排序
  const criticalDays = [];
  for (let d = 1; d <= days; d++) {
    if (isCriticalDay(d)) criticalDays.push(d);
  }

  // 對每個 critical day，預排缺少的 slot
  for (const d of criticalDays) {
    const cov = getDayCoverage(d);
    for (const slot of ['AE', 'AT', 'EA']) {
      if (cov[slot].length > 0) continue;
      const candidates = getCandidatesForSlot(slot);
      for (const sid of candidates) {
        const staff = state.staff.find(s => s.id === sid);
        if (!staff) continue;
        const cfg = getSlotConfigForStaff(staff);
        if (cfg.ptMode === 'fixed') continue;
        if (locked(sid, d)) continue;
        const v = get(sid, d);
        if (OFF.includes(v) || SICK.includes(v)) continue;
        if (v && isWork(v) && getLooseCoveredSlot(v) !== slot) continue;
        if (!slotLegal(staff, d, slot)) continue;
        const cb = consecBefore(sid, d), ca = consecAfter(sid, d);
        if (cb + 1 + ca > 5) continue;
        set(sid, d, slot);
        criticalLocks.add(cellKey(sid, d));
        cov[slot].push(sid);
        break;
      }
    }
  }

  // ===== Phase 2: 逐日補缺班 =====
  for (let d = 1; d <= days; d++) {
    const cov = getDayCoverage(d);
    for (const slot of ['AE','AT','EA']) {
      if (cov[slot].length > 0) continue; // 已有人
      // 依優先順位找候選人
      const priorityIds = getCandidatesForSlot(slot);
      let filled = false;
      for (const sid of priorityIds) {
        const staff = state.staff.find(s => s.id === sid);
        if (!staff) continue;
        const cfg = getSlotConfigForStaff(staff);
        // ptMode=fixed 不自動排
        if (cfg.ptMode === 'fixed') continue;
        // 該 slot 不在此人設定裡
        if (!cfg.slots[slot]) continue;
        // 手動鎖定
        if (locked(sid, d)) continue;
        const v = get(sid, d);
        // 已是 OFF / SICK
        if (OFF.includes(v) || SICK.includes(v)) continue;
        // PT 月上限
        if (staff.type === 'PT' && workCount(sid) >= 15) continue;
        // 連上超過 5
        if (consecBefore(sid, d) + 1 + consecAfter(sid, d) > 5) continue;
        // 11h + forbidden
        if (!slotLegal(staff, d, slot)) continue;
        // 關鍵日保護：flex PT 排 EA 前，確認不卡死隔天 AE/AT
        if (wouldBlockNextDayCriticalCoverage(staff, d, slot, sch)) continue;
        // 如果已有其他班，先跳過（不換班，留給 Phase 5）
        if (v && isWork(v) && getLooseCoveredSlot(v) !== slot) continue;
        set(sid, d, slot);

        filled = true;
        cov[slot].push(sid);
        break;
      }
      if (!filled) {
        violations.push({ type:'SHIFT_NOT_COVERED', day:d,
          detail: d+'日 '+slot+' 無人補班（Phase2）' });
      }
    }
  }

  // ===== Phase 3: 正職空白格排休（quota 未滿才排）=====
  const seika = state.staff.filter(s => s.type === '正職');
  seika.forEach(s => {
    const existingOff = [];
    for (let d = 1; d <= days; d++) {
      if (OFF.includes(get(s.id, d))) existingOff.push(d);
    }
    let offCount = existingOff.length;
    if (offCount >= quotaTotal) return;

    const cfg = getSlotConfigForStaff(s);

    for (let d = 1; d <= days; d++) {
      if (offCount >= quotaTotal) break;
      if (locked(s.id, d)) continue;
      const v = get(s.id, d);
      if (v !== '') continue; // 已排班或已有值
      if (SICK.includes(v)) continue;
      // 自動連休 ≤ 2
      if (autoRestStreak(s.id, d) > 2) continue;
      // 排休後當天 slot 仍有人
      const mainSlot = cfg.mainSlot;
      if (mainSlot && !slotStillCoveredIfRest(s.id, d, mainSlot)) continue;
      set(s.id, d, '休');
      offCount++;
    }

    if (offCount < quotaTotal) {
      violations.push({ type:'QUOTA_MISMATCH', staffName: s.name,
        detail: s.name+' 休假不足 '+offCount+'/'+quotaTotal+'，需 Phase5 修補' });
    }
  });

  // ===== Phase 2.5: 正職空白格補主班 =====
  seika.forEach(s => {
    const cfg = getSlotConfigForStaff(s);
    const mainSlot = cfg.mainSlot;
    if (!mainSlot) return;
    for (let d = 1; d <= days; d++) {
      if (locked(s.id, d)) continue;
      if (get(s.id, d) !== '') continue;
      // 11h + forbidden pair 檢查
      if (!slotLegal(s, d, mainSlot)) continue;
      // 空白且 quota 已滿 → 補主班

      set(s.id, d, mainSlot);
    }
  });

  return { schedule: sch, manualLocks, violations, criticalLocks };
}

function greedyFillLegacy(solverInput) {
  const { schedule, manualLocks, days, quota } = solverInput;
  const violations = [];

  // 深拷貝
  const sch = {};
  state.staff.forEach(s => {
    sch[s.id] = {};
    for (let d = 1; d <= days; d++) {
      sch[s.id][d] = (schedule[s.id] && schedule[s.id][d]) || '';
    }
  });

  const seika   = state.staff.filter(s => s.type === '正職');
  const ptAll   = state.staff.filter(s => s.type === 'PT');
  const manager = state.staff.find(s => s.type === '主管');
  const quotaTotal = quota.li + quota.xi + quota.guo;
  const defaultShift = {};

  function get(staffId, d) { return (sch[staffId] && sch[staffId][d]) || ''; }
  function set(staffId, d, v) { if (sch[staffId]) sch[staffId][d] = v; }
  function locked(staffId, d) { return manualLocks.has(cellKey(staffId, d)); }

  function workCount(staffId) {
    let c = 0;
    for (let d = 1; d <= days; d++) if (isWork(get(staffId, d))) c++;
    return c;
  }

  function consecutiveBefore(staffId, d) {
    let c = 0;
    for (let dd = d - 1; dd >= 1; dd--) {
      if (isWork(get(staffId, dd))) c++; else break;
    }
    return c;
  }
  function consecutiveAfter(staffId, d) {
    let c = 0;
    for (let dd = d + 1; dd <= days; dd++) {
      if (isWork(get(staffId, dd))) c++; else break;
    }
    return c;
  }

  function shiftLegal(staffId, d, shift) {
    const prev = d > 1    ? get(staffId, d - 1) : '';
    const next = d < days ? get(staffId, d + 1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRest(prev, shift)) return false;
      if (isForbiddenShiftPair(prev, shift)) return false;
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRest(shift, next)) return false;
      if (isForbiddenShiftPair(shift, next)) return false;
    }
    return true;
  }

  // 自動連休計數（只看已確認的 OFF/SICK，空白不計）
  function autoRestStreak(staffId, d) {
    let before = 0, after = 0;
    for (let dd = d - 1; dd >= 1; dd--) {
      const v = get(staffId, dd);
      if (!v) break;
      if ((OFF.includes(v) || SICK.includes(v)) && !locked(staffId, dd)) before++;
      else break;
    }
    for (let dd = d + 1; dd <= days; dd++) {
      const v = get(staffId, dd);
      if (!v) break;
      if ((OFF.includes(v) || SICK.includes(v)) && !locked(staffId, dd)) after++;
      else break;
    }
    return before + 1 + after;
  }

  // 計算這天往前/後到最近確認休假（或月份邊界）的距離
  // 空白和已確認上班都算「潛在上班」
  function runLengthBefore(staffId, d) {
    let c = 0;
    for (let dd = d - 1; dd >= 1; dd--) {
      const v = get(staffId, dd);
      if (v && (OFF.includes(v) || SICK.includes(v))) break;
      c++;
    }
    return c;
  }
  function runLengthAfter(staffId, d) {
    let c = 0;
    for (let dd = d + 1; dd <= days; dd++) {
      const v = get(staffId, dd);
      if (v && (OFF.includes(v) || SICK.includes(v))) break;
      c++;
    }
    return c;
  }

  // 覆蓋判斷：confirmed + potential 兩層
  function coveredIfRest(targetStaff, d) {
    const missing = [];
    for (const sh of ['AE','AT','EA']) {
      let confirmed = false;
      for (const s of state.staff) {
        if (s.id === targetStaff.id) continue;
        const v = get(s.id, d);
        if (v && isWork(v) && getLooseCoveredSlot(v) === sh) { confirmed = true; break; }
      }
      if (!confirmed) missing.push(sh);
    }
    if (missing.length === 0) return { ok: true, risk: false };

    let impossible = false;
    let needsHelp = false;
    for (const sh of missing) {
      let canCover = false;
      for (const s of state.staff) {
        if (s.id === targetStaff.id) continue;
        if (!s.canShifts || !s.canShifts.includes(sh)) continue;
        const v = get(s.id, d);
        if (locked(s.id, d)) {
          if (isWork(v) && getCoveredSlot(v) === sh) { canCover = true; break; }
          continue;
        }
        if (OFF.includes(v) || SICK.includes(v)) continue;
        if (s.type === 'PT' && workCount(s.id) >= 15) continue;
        canCover = true;
        needsHelp = true;
        break;
      }
      if (!canCover) { impossible = true; break; }
    }
    return { ok: !impossible, risk: needsHelp };
  }

  // 候選日評分（分數越高越優先）
  function scoreRestCandidate(staffId, d, ideal) {
    let score = 0;

    // 1. 切斷長連上：能把最長區段切到 <=5 得高分
    const before = runLengthBefore(staffId, d);
    const after  = runLengthAfter(staffId, d);
    const maxRun = Math.max(before, after);
    if (maxRun > 5) score += (maxRun - 5) * 200; // 越能切斷長區段分數越高

    // 2. 距離 ideal 越近越好（次要）
    score -= Math.abs(d - ideal) * 3;

    // 3. 自動連休接近 2 扣分
    const streak = autoRestStreak(staffId, d) - 1; // 不含自身
    if (streak === 1) score -= 20;

    // 4. 需要 PT/主管補班扣分
    const cov = coveredIfRest({ id: staffId }, d);
    if (cov.risk) score -= 30;

    return score;
  }

  // ===== Step G1: 記錄 defaultShift，不寫入 sch =====
  seika.forEach(s => {
    s._mainShift = s.canShifts.length === 1 ? s.canShifts[0]
      : s.name.includes('辰倩') ? 'AT'
      : s.name.includes('苡禎') ? 'EA' : 'AE';
    defaultShift[s.id] = s._mainShift;
  });

  // ===== Step G2: 正職均勻分配官方休假（以切斷長連上為優先）=====

  // 找出目前所有潛在連續上班區段
  function findWorkSegments(staffId) {
    const segments = [];
    let segStart = -1;
    for (let d = 1; d <= days + 1; d++) {
      const v = d <= days ? get(staffId, d) : '';
      const isOff = v && (OFF.includes(v) || SICK.includes(v));
      if (!isOff && d <= days) {
        if (segStart === -1) segStart = d;
      } else {
        if (segStart !== -1) {
          segments.push({ start: segStart, end: d - 1, length: d - 1 - segStart + 1 });
          segStart = -1;
        }
      }
    }
    return segments;
  }

  // 模擬把 day 設為休後，最大連續上班區段長度
  function maxRunAfterRest(staffId, day) {
    let maxLen = 0, cur = 0;
    for (let d = 1; d <= days; d++) {
      const v = d === day ? '休' : get(staffId, d);
      const isOff = v && (OFF.includes(v) || SICK.includes(v));
      if (!isOff) { cur++; maxLen = Math.max(maxLen, cur); }
      else cur = 0;
    }
    return maxLen;
  }

  // 新版候選日評分
  function scoreRestCandidateV2(staffId, day, ideal) {
    let score = 0;
    const segs = findWorkSegments(staffId);
    const maxSeg = segs.reduce((m, s2) => s2.length > m.length ? s2 : m, { length: 0, start: 0, end: 0 });

    // 1. 切斷最長區段：day 在最長區段內，且越接近中間越好
    if (maxSeg.length > 0 && day >= maxSeg.start && day <= maxSeg.end) {
      const mid = Math.round((maxSeg.start + maxSeg.end) / 2);
      const distToMid = Math.abs(day - mid);
      score += 1000 + (maxSeg.length - distToMid) * 10;
    }

    // 2. 放休後最大連續區段降幅
    const curMax = maxSeg.length;
    const newMax = maxRunAfterRest(staffId, day);
    score += (curMax - newMax) * 80;

    // 3. 放休後所有區段都 <= 5，額外加分
    if (newMax <= 5) score += 500;

    // 4. ideal 距離（次要）
    score -= Math.abs(day - ideal) * 2;

    // 5. 接近自動連休 2 天扣分
    const streak = autoRestStreak(staffId, day) - 1;
    if (streak === 1) score -= 30;

    // 6. 需要補班扣分
    const cov = coveredIfRest({ id: staffId }, day);
    if (cov.risk) score -= 50;

    return score;
  }

  seika.forEach((s, si) => {
    const existingOff = [];
    for (let d = 1; d <= days; d++) {
      if (OFF.includes(get(s.id, d))) existingOff.push(d);
    }
    const autoNeed = Math.max(0, quotaTotal - existingOff.length);
    if (autoNeed === 0) return;
    if (existingOff.length > quotaTotal) {
      violations.push({ type:'QUOTA_MISMATCH', staffName:s.name,
        detail: s.name + ' 既有 OFF 已超過 quota（' + existingOff.length + '/' + quotaTotal + '）' });
      return;
    }

    const step   = days / quotaTotal;
    const offset = si * (step / seika.length);
    let placed   = 0;

    while (placed < autoNeed) {
      const ideal = Math.round(offset + (placed + existingOff.length + 0.5) * step);

      const candidates = Array.from({length: days}, (_, idx) => idx + 1)
        .filter(d => {
          if (locked(s.id, d)) return false;
          const v = get(s.id, d);
          if (OFF.includes(v) || SICK.includes(v)) return false;
          if (autoRestStreak(s.id, d) > 2) return false;
          const cov = coveredIfRest(s, d);
          if (!cov.ok) return false;
          return true;
        });

      if (candidates.length === 0) {
        violations.push({ type:'QUOTA_MISMATCH', staffName:s.name,
          detail: s.name + ' 無法補足官方休假，目前 '
                  + (existingOff.length + placed) + '/' + quotaTotal });
        break;
      }

      candidates.sort((a, b) =>
        scoreRestCandidateV2(s.id, b, ideal) - scoreRestCandidateV2(s.id, a, ideal)
      );

      set(s.id, candidates[0], '休');
      placed++;
    }
  });

  // ===== Step G2.5: 把正職空白格填入 defaultShift =====
  seika.forEach(s => {
    for (let d = 1; d <= days; d++) {
      if (locked(s.id, d)) continue;
      if (get(s.id, d) === '') set(s.id, d, defaultShift[s.id]);
    }

  });

  // ===== Step G3: 修正正職 11h 違規（交換休假日）=====
  seika.forEach(s => {
    for (let d = 1; d < days; d++) {
      const v1 = get(s.id, d), v2 = get(s.id, d + 1);
      if (!isWork(v1) || !isWork(v2)) continue;
      if (hasElevenHourRest(v1, v2) && !isForbiddenShiftPair(v1, v2)) continue;
      if (locked(s.id, d) && locked(s.id, d + 1)) continue;
      let fixed = false;
      const searchRange = Array.from({length: days}, (_, i) => i + 1)
        .sort((a, b) => Math.abs(a - (d + 1)) - Math.abs(b - (d + 1)));
      for (const nd of searchRange) {
        if (nd === d + 1) continue;
        if (locked(s.id, nd)) continue;
        if (!OFF.includes(get(s.id, nd))) continue;
        const origD1 = get(s.id, d + 1);
        const origNd = get(s.id, nd);
        set(s.id, d + 1, '休');
        set(s.id, nd, defaultShift[s.id]);
        const ok1 = !isForbiddenShiftPair(v1, '休');
        const ok2 = shiftLegal(s.id, nd, defaultShift[s.id]);
        const ok3 = consecutiveBefore(s.id, nd) + 1 + consecutiveAfter(s.id, nd) <= 5;
        const ok4 = autoRestStreak(s.id, d + 1) <= 2;
        if (ok1 && ok2 && ok3 && ok4) { fixed = true; break; }
        set(s.id, d + 1, origD1);
        set(s.id, nd, origNd);
      }
      if (!fixed) {
        violations.push({ type:'ELEVEN_HOUR_VIOLATION', staffName:s.name,
          detail: s.name + ' ' + d + '日→' + (d + 1) + '日 11h違規無法修正' });
      }
    }
  });

  // ===== Step G4: 補缺班（PT 優先，主管補底）=====

  function canAssignWork(candidate, day, shift) {
    const key = cellKey(candidate.id, day);
    if (manualLocks.has(key)) return { ok: false, reason: 'manual_locked' };
    if (!candidate.canShifts || !candidate.canShifts.includes(shift))
      return { ok: false, reason: 'cannot_shift' };
    const v = get(candidate.id, day);
    if (SICK.includes(v)) return { ok: false, reason: 'sick_leave' };
    if (isWork(v) && v !== shift) return { ok: false, reason: 'already_working[' + v + ']' };
    if (candidate.type === 'PT' && workCount(candidate.id) >= 15)
      return { ok: false, reason: 'pt_over15[' + workCount(candidate.id) + ']' };
    const cb = consecutiveBefore(candidate.id, day);
    const ca = consecutiveAfter(candidate.id, day);
    if (cb + 1 + ca > 5)
      return { ok: false, reason: 'consecutive_over5[前' + cb + '後' + ca + ']' };
    const prev = day > 1    ? get(candidate.id, day - 1) : '';
    const next = day < days ? get(candidate.id, day + 1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRest(prev, shift))
        return { ok: false, reason: '11h_prev[' + prev + ']' };
      if (isForbiddenShiftPair(prev, shift))
        return { ok: false, reason: 'forbidden_pair_prev[' + prev + ']' };
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRest(shift, next))
        return { ok: false, reason: '11h_next[' + next + ']' };
      if (isForbiddenShiftPair(shift, next))
        return { ok: false, reason: 'forbidden_pair_next[' + next + ']' };
    }
    return { ok: true, reason: 'ok' };
  }

  const missingFillFailures = [];

  for (let d = 1; d <= days; d++) {
    for (const sh of ['AE','AT','EA']) {
      if (state.staff.some(s => getLooseCoveredSlot(get(s.id, d)) === sh)) continue;

      let filled = false;
      const failureLog = [];

      const ptSorted = [...ptAll].sort((a, b) => workCount(a.id) - workCount(b.id));
      for (const pt of ptSorted) {
        const result = canAssignWork(pt, d, sh);
        if (result.ok) {
          set(pt.id, d, sh);
          filled = true;
          break;
        }
        failureLog.push({ name: pt.name, type: 'PT', reason: result.reason });
      }
      if (filled) continue;

      if (manager) {
        const result = canAssignWork(manager, d, sh);
        if (result.ok) {
          set(manager.id, d, sh);
          filled = true;
        } else {
          failureLog.push({ name: manager.name, type: '主管', reason: result.reason });
        }
      }
      if (filled) continue;

      missingFillFailures.push({ day: d, shift: sh, candidates: failureLog });
      violations.push({ type: 'SHIFT_NOT_COVERED', day: d,
        detail: d + '日 ' + sh + ' 無人補班' });
    }
  }

  if (missingFillFailures.length > 0) {
    console.warn('[G4] 補班失敗明細：');
    console.table(missingFillFailures.map(f => ({
      日期: f.day + '日',
      缺班: f.shift,
      原因: f.candidates.map(c => c.name + ':' + c.reason).join(' | ')
    })));
  }

  seika.forEach(s => { delete s._mainShift; });
  return { schedule: sch, manualLocks, violations };
}


// ===== SOLVER PHASE 3b: 正職休假不足 → 工作日改休 + 候補補班（atomic） =====

function getViolationSummary(sch, manualLocks, days, quota) {
  const r = validateSchedule({ schedule: sch, manualLocks, days, quota });
  const hv = r.hardViolations.filter(v => v.source !== 'manual');
  const quotaTotal = quota.li + quota.xi + quota.guo;
  let totalQuotaShortage = 0;
  state.staff.filter(s => s.type === '正職').forEach(s => {
    let off = 0;
    for (let d = 1; d <= days; d++) {
      if (OFF.includes((sch[s.id] && sch[s.id][d]) || '')) off++;
    }
    if (off < quotaTotal) totalQuotaShortage += (quotaTotal - off);
  });
  return {
    totalHard: hv.length,
    totalQuotaShortage,
    shiftNotCoveredCount: hv.filter(v => v.type === 'SHIFT_NOT_COVERED').length,
    elevenHourCount:      hv.filter(v => v.type === 'ELEVEN_HOUR_VIOLATION').length,
    consecutiveCount:     hv.filter(v => v.type === 'CONSECUTIVE_OVER5').length,
    quotaMismatchCount:   hv.filter(v => v.type === 'QUOTA_MISMATCH').length,
  };
}

function isImprovement(before, after) {
  // 必須：休假缺口下降
  if (after.totalQuotaShortage >= before.totalQuotaShortage) return false;
  // 不允許：缺班 / 11h / 連上 增加
  if (after.shiftNotCoveredCount > before.shiftNotCoveredCount) return false;
  if (after.elevenHourCount      > before.elevenHourCount)      return false;
  if (after.consecutiveCount     > before.consecutiveCount)      return false;
  return true;
}

function repairQuotaByReplacingWorkDays(solverInput, sch) {
  const { manualLocks, days, quota } = solverInput;
  const quotaTotal = quota.li + quota.xi + quota.guo;
  const repairLog = [];

  function get(staffId, d) { return (sch[staffId] && sch[staffId][d]) || ''; }
  function set(staffId, d, v) { if (sch[staffId]) sch[staffId][d] = v; }
  function locked(staffId, d) { return manualLocks.has(cellKey(staffId, d)); }

  function countOff(staffId) {
    let c = 0;
    for (let d = 1; d <= days; d++) if (OFF.includes(get(staffId, d))) c++;
    return c;
  }
  function countWork(staffId) {
    let c = 0;
    for (let d = 1; d <= days; d++) if (isWork(get(staffId, d))) c++;
    return c;
  }
  function consecBefore(staffId, d) {
    let c = 0;
    for (let dd = d-1; dd >= 1; dd--) { if (isWork(get(staffId, dd))) c++; else break; }
    return c;
  }
  function consecAfter(staffId, d) {
    let c = 0;
    for (let dd = d+1; dd <= days; dd++) { if (isWork(get(staffId, dd))) c++; else break; }
    return c;
  }
  function autoRestStreak(staffId, d) {
    let before = 0, after = 0;
    for (let dd = d-1; dd >= 1; dd--) {
      const v = get(staffId, dd);
      if (!v) break;
      if ((OFF.includes(v)||SICK.includes(v)) && !locked(staffId, dd)) before++; else break;
    }
    for (let dd = d+1; dd <= days; dd++) {
      const v = get(staffId, dd);
      if (!v) break;
      if ((OFF.includes(v)||SICK.includes(v)) && !locked(staffId, dd)) after++; else break;
    }
    return before + 1 + after;
  }
  function slotLegalInSch(staff, d, slot) {
    const prev = d > 1    ? get(staff.id, d-1) : '';
    const next = d < days ? get(staff.id, d+1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRestByDay(staff, prev, d-1, slot, d)) return false;
      if (isForbiddenShiftPair(prev, slot)) return false;
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRestByDay(staff, slot, d, next, d+1)) return false;
      if (isForbiddenShiftPair(slot, next)) return false;
    }
    return true;
  }

  // 找 replacement：策略 A，只用空白格
  function findReplacement(slotToCover, d, excludeId) {
    const priority = getCandidatesForSlot(slotToCover);
    for (const sid of priority) {
      if (sid === excludeId) continue;
      const sub = state.staff.find(x => x.id === sid);
      if (!sub) continue;
      const cfg = getSlotConfigForStaff(sub);
      if (cfg.ptMode === 'fixed') continue;
      if (!cfg.slots[slotToCover]) continue;
      if (locked(sid, d)) continue;
      const sv = get(sid, d);
      // 策略A：只能是空白格
      if (sv !== '') continue;
      if (sub.type === 'PT' && countWork(sid) >= 15) continue;
      if (consecBefore(sid, d) + 1 + consecAfter(sid, d) > 5) continue;
      if (!slotLegalInSch(sub, d, slotToCover)) continue;
      // 候補正職不能休假不足
      if (sub.type === '正職' && countOff(sid) < quotaTotal) continue;
      return sid;
    }
    return null;
  }

  const seika = state.staff.filter(s => s.type === '正職');
  for (const s of seika) {
    let shortage = quotaTotal - countOff(s.id);
    if (shortage <= 0) continue;

    const workDays = [];
    for (let d = 1; d <= days; d++) {
      if (locked(s.id, d)) continue;
      const v = get(s.id, d);
      if (!isWork(v)) continue;
      if (autoRestStreak(s.id, d) > 2) continue;
      // 先找得到候補才加入候選
      const slotToCover = getLooseCoveredSlot(v) || v;
      const subId = findReplacement(slotToCover, d, s.id);
      if (!subId) { repairLog.push({ staff:s.name, day:d, result:'找不到候補，跳過' }); continue; }
      const runScore = Math.max(consecBefore(s.id, d), consecAfter(s.id, d));
      workDays.push({ d, v, slotToCover, subId, runScore });
    }
    workDays.sort((a, b) => b.runScore - a.runScore);

    for (const { d, v: origVal, slotToCover, subId } of workDays) {
      if (shortage <= 0) break;
      const before = getViolationSummary(sch, manualLocks, days, quota);
      // Atomic：同時改兩格

      set(s.id, d, '休');
      set(subId, d, slotToCover);
      const after = getViolationSummary(sch, manualLocks, days, quota);
      if (isImprovement(before, after)) {
        repairLog.push({ staff:s.name, day:d, sub:subId, result:'成功' });
        shortage--;
      } else {
        set(s.id, d, origVal);
        set(subId, d, '');
        repairLog.push({ staff:s.name, day:d, result:'交換後未符合改善條件，還原' });
      }
    }
  }

  if (repairLog.some(r => r.result === '成功')) {
    console.log('[Phase3b] 休假修補記錄：');
    console.table(repairLog.filter(r => r.result === '成功'));
  }
  const failures = repairLog.filter(r => r.result !== '成功');
  if (failures.length > 0) console.warn('[Phase3b] 未成功修補數：', failures.length);
  return sch;
}

// ===== SOLVER PHASE 6: 優化人力配置（減少重複覆蓋與主管出勤）=====

function optimizeByMovingRestForDuplicateCoverage(solverInput, sch) {
  const { manualLocks, days, quota } = solverInput;
  const quotaTotal = quota.li + quota.xi + quota.guo;
  const optLog = [];

  function get(sid, d) { return (sch[sid] && sch[sid][d]) || ''; }
  function set(sid, d, v) { if (sch[sid]) sch[sid][d] = v; }
  function locked(sid, d) { return manualLocks.has(cellKey(sid, d)); }
  function isAutoRest(sid, d) {
    return OFF.includes(get(sid, d)) && !locked(sid, d);
  }
  function countOff(sid) {
    let c = 0;
    for (let d = 1; d <= days; d++) if (OFF.includes(get(sid, d))) c++;
    return c;
  }
  function consecBefore(sid, d) {
    let c = 0;
    for (let dd = d-1; dd >= 1; dd--) { if (isWork(get(sid, dd))) c++; else break; }
    return c;
  }
  function consecAfter(sid, d) {
    let c = 0;
    for (let dd = d+1; dd <= days; dd++) { if (isWork(get(sid, dd))) c++; else break; }
    return c;
  }
  function autoRestStreak(sid, d) {
    let before = 0, after = 0;
    for (let dd = d-1; dd >= 1; dd--) {
      const v = get(sid, dd);
      if (!v) break;
      if (OFF.includes(v) && !locked(sid, dd)) before++; else break;
    }
    for (let dd = d+1; dd <= days; dd++) {
      const v = get(sid, dd);
      if (!v) break;
      if (OFF.includes(v) && !locked(sid, dd)) after++; else break;
    }
    return before + 1 + after;
  }
  function slotLegalChange(staff, d, toSlot) {
    const prev = d > 1    ? get(staff.id, d-1) : '';
    const next = d < days ? get(staff.id, d+1) : '';
    if (prev && isWork(prev)) {
      if (!hasElevenHourRestByDay(staff, prev, d-1, toSlot, d)) return false;
      if (isForbiddenShiftPair(prev, toSlot)) return false;
    }
    if (next && isWork(next)) {
      if (!hasElevenHourRestByDay(staff, toSlot, d, next, d+1)) return false;
      if (isForbiddenShiftPair(toSlot, next)) return false;
    }
    return true;
  }
  function getDayCov(d) {
    const cov = { AE:[], AT:[], EA:[] };
    state.staff.forEach(s => {
      const slot = getLooseCoveredSlot(get(s.id, d));
      if (slot) cov[slot].push(s.id);
    });
    return cov;
  }
  function hardCountNonManual() {
    const r = validateSchedule({ schedule: sch, manualLocks, days, quota });
    return r.hardViolations.filter(v => v.source !== 'manual').length;
  }
  function supervisorDays() {
    const mgr = state.staff.find(s => s.type === '主管');
    if (!mgr) return 0;
    let c = 0;
    for (let d = 1; d <= days; d++) if (isWork(get(mgr.id, d))) c++;
    return c;
  }

  // 找當天 coverage 在移除某人後是否仍完整
  function covOKWithoutStaff(sid, d) {
    const needed = ['AE','AT','EA'];
    for (const slot of needed) {
      const cov = getDayCov(d);
      const others = cov[slot].filter(id => id !== sid);
      if (cov[slot].includes(sid) && others.length === 0) return false;
    }
    return true;
  }

  // 嘗試在補償日進行 re-balance，回傳需要套用的變更組，或 null
  // changes = [{sid, d, newVal, origVal}]
  function tryCompensateDayBundle(staff, compDay, compSlot) {
    const cfg = getSlotConfigForStaff(staff);
    const covNow = getDayCov(compDay);

    const slotPriority = [];
    for (const sl of (staff.canShifts || [])) {
      if (!cfg.slots[sl]) continue;
      const hasPTFlex = covNow[sl] && covNow[sl].some(sid => {
        const s = state.staff.find(x => x.id === sid);
        if (!s) return false;
        const sc = getSlotConfigForStaff(s);
